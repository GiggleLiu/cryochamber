description = "Session 1 hibernates with past wake, then sleeps so the test can drop an inbox file before the loop resumes."

counter = ".mock-session-count"

[[when]]
session = "1"
actions = [
    { kind = "todo_add", text = "past wake", at = "-10m" },
    { kind = "hibernate", summary = "Session 1 done", linger = 0 },
    { kind = "sleep", seconds = 2 },
]

# Session 2 is the inbox-triggered wake: it drains and answers the mail before
# hibernating, because the quietness gate refuses a hibernate with unread mail.
[[when]]
session = "*"
actions = [
    { kind = "receive" },
    { kind = "send", message = "Handled the inbox wake" },
    { kind = "hibernate", complete = true, summary = "Plan completed after inbox wake" },
]
