description = "Alert, add TODO at $TEST_WAKE_AT, then hibernate (not complete)."

[[actions]]
kind = "alert"
channel = "email"
target = "ops@test.com"
message = "Watchdog set"

[[actions]]
kind = "todo_add"
text = "scheduled wake"
at = "$TEST_WAKE_AT"

[[actions]]
kind = "hibernate"
summary = "Waiting for next wake"
