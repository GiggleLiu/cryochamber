description = "Two conversation rounds inside one live session via the reply window: the parked hibernate is rejected by mail arriving inside the window."

[[actions]]
kind = "send"
message = "what is my mission?"

[[actions]]
kind = "todo_add"
text = "next"
at = "+1h"

# Blocks: the daemon parks this hibernate for the reply window and rejects it
# when the operator's next message lands.
[[actions]]
kind = "hibernate"
summary = "round 1 done"
linger = 30

[[actions]]
kind = "receive"

[[actions]]
kind = "send"
message = "ack: second round"

# Round 2 requests no window at all: the duration is reselected per
# hibernate, so this one is granted immediately instead of parking again.
[[actions]]
kind = "hibernate"
summary = "reply-window round-trip done"
linger = 0
