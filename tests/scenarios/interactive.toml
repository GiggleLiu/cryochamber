description = "Two conversation rounds inside one live session via receive --wait."

[[actions]]
kind = "send"
message = "what is my mission?"

[[actions]]
kind = "receive_wait"
timeout = 60
contains = ["second round"]

[[actions]]
kind = "send"
message = "ack: second round"

[[actions]]
kind = "todo_add"
text = "next"
at = "+1h"

[[actions]]
kind = "hibernate"
summary = "interactive round-trip done"
