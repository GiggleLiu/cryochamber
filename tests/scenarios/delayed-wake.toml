description = "Session 1 hibernates with a past wake time; session 2 detects delayed wake."

counter = ".mock-session-count"

[[when]]
session = "1"
actions = [
    { kind = "todo_add", text = "past wake", at = "-10m" },
    { kind = "hibernate", summary = "Session 1 done, testing delayed wake" },
]

[[when]]
session = "*"
actions = [{ kind = "hibernate", complete = true, summary = "Plan completed after delayed wake" }]
