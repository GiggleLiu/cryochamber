description = "First invocation crashes; retry completes the plan."

counter = ".mock-crash-count"

[[when]]
session = "1"
actions = [
  { kind = "todo_add", text = "Retry crashed session", at = "now" },
  { kind = "exit", code = 1 },
]

[[when]]
session = "*"
actions = [{ kind = "hibernate", complete = true, summary = "Succeeded on retry" }]
