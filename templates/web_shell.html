<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cryohub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/web.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img src="/assets/logo.svg" class="logo" alt="cryochamber">
    <span class="hub-tag">HUB</span>
    <span class="workspace">workspace · <strong id="workspace-path"></strong></span>
  </div>
  <div class="topbar-right">
    <span class="kbd">⌘K  search</span>
  </div>
</div>

<div class="app">

  <aside class="rail">
    <div class="rail-head">
      <span class="title">Chambers</span>
      <span class="count" id="rail-count">0</span>
    </div>
    <input class="rail-search" id="rail-search" placeholder="Filter chambers…">
    <div class="rail-list" id="chamber-list"></div>
    <div class="rail-foot">
      <span>auto-refresh · on</span>
      <span><button id="refresh">⟳</button></span>
    </div>
  </aside>

  <section class="center" id="pane">
    <div class="pane-empty">
      <div>Pick a chamber from the rail</div>
    </div>
  </section>

  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-tabs">
      <div class="drawer-tab active" data-tab="todos">Todos<span class="tab-count" id="todos-count">0</span></div>
      <div class="drawer-tab" data-tab="sync">Sync</div>
      <div class="drawer-tab" data-tab="log">Log</div>
    </div>
    <div class="drawer-body" data-panel="todos" id="panel-todos"></div>
    <div class="drawer-body hidden" data-panel="sync" id="panel-sync"></div>
    <div class="drawer-body hidden" data-panel="log" id="panel-log"></div>
  </aside>

</div>

<div id="toast" class="toast"></div>

<script>
(function() {
  const state = {
    chambers: [],
    currentId: null,
  };

  function urlChamberId() {
    const m = window.location.pathname.match(/^\/c\/(.+)$/);
    return m ? m[1] : null;
  }

  async function fetchJSON(url, opts) {
    const res = await fetch(url, opts);
    if (!res.ok) throw new Error(`${url}: ${res.status}`);
    return res.json();
  }

  function toast(msg, kind) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast' + (kind === 'error' ? ' error' : '');
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function hash32(s) {
    let h = 0x811c9dc5 >>> 0;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h.toString(36);
  }

  function statusClass(entry) {
    if (entry.config_error) return 'error';
    if (entry.source === 'external') return 'external';
    if (entry.completed && !entry.running) return 'complete';
    if (entry.running) return 'running';
    return 'stopped';
  }

  function renderRail() {
    const list = document.getElementById('chamber-list');
    list.innerHTML = '';
    const sorted = [...state.chambers].sort((a, b) => {
      const rank = e => (e.running ? 0 : (e.source === 'external' ? 2 : 1));
      const ra = rank(a), rb = rank(b);
      if (ra !== rb) return ra - rb;
      return a.name.localeCompare(b.name);
    });
    for (const c of sorted) {
      const row = document.createElement('div');
      row.className = 'chamber' + (c.id === state.currentId ? ' active' : '');
      row.dataset.id = c.id;

      const row1 = document.createElement('div');
      row1.className = 'chamber-row1';
      const dot = document.createElement('span');
      dot.className = 'status-dot ' + statusClass(c);
      const name = document.createElement('span');
      name.className = 'chamber-name';
      name.textContent = c.name;
      row1.appendChild(dot);
      row1.appendChild(name);
      if (c.unread > 0) {
        const badge = document.createElement('span');
        badge.className = 'unread';
        badge.textContent = c.unread;
        row1.appendChild(badge);
      }
      row.appendChild(row1);

      if (c.last_message_preview) {
        const prev = document.createElement('div');
        prev.className = 'chamber-preview';
        prev.textContent = c.last_message_preview;
        row.appendChild(prev);
      }

      const meta = document.createElement('div');
      meta.className = 'chamber-meta';
      const task = document.createElement('span');
      task.className = 'task';
      task.textContent = c.task ? `Task: ${c.task}` : (c.config_error ? 'config error' : '');
      const when = document.createElement('span');
      when.className = 'when' + (c.wake_imminent ? ' soon' : '');
      when.textContent = c.next_wake_display || '';
      meta.appendChild(task);
      meta.appendChild(when);
      row.appendChild(meta);

      row.addEventListener('click', () => selectChamber(c.id));
      list.appendChild(row);
    }
    document.getElementById('rail-count').textContent = state.chambers.length;
  }

  async function loadChambers() {
    state.chambers = await fetchJSON('/api/chambers');
    renderRail();
  }

  let view = null;

  function newView() {
    return {
      chamberId: null,
      headerName: null,
      headerMeta: null,
      headerTaskLine: null,
      planCompleteBox: null,
      lifecycleBtns: null,
      panels: { todos: null, sync: null, log: null },
      lastMsgKey: null,
      lastTodoSig: null,
      lastSyncSig: null,
      lastLifecycleSig: null,
    };
  }

  function btn(label, onClick, cls) {
    const b = document.createElement('button');
    b.textContent = label;
    if (cls) b.className = cls;
    b.addEventListener('click', onClick);
    return b;
  }

  function statusDotChar(entry) {
    if (entry.config_error) return '✗';
    if (entry.source === 'external') return '⚠';
    if (entry.completed && !entry.running) return '✓';
    return entry.running ? '●' : '○';
  }

  function buildHead(pane, entry, status) {
    const head = document.createElement('div');
    head.className = 'thread-head';

    const left = document.createElement('div');
    left.className = 'left';
    const title = document.createElement('div');
    title.className = 'title';
    const name = document.createElement('span');
    name.textContent = entry.name;
    const session = document.createElement('span');
    session.className = 'session';
    left.appendChild(title);
    title.appendChild(name);
    title.appendChild(session);

    const task = document.createElement('div');
    task.className = 'task';
    left.appendChild(task);

    const plan = document.createElement('div');
    plan.className = 'plan-complete';
    plan.style.display = 'none';
    left.appendChild(plan);

    const lifecycle = document.createElement('div');
    lifecycle.className = 'lifecycle';
    left.appendChild(lifecycle);

    const right = document.createElement('div');
    const wake = document.createElement('span');
    wake.className = 'wake-chip';
    right.appendChild(wake);

    head.appendChild(left);
    head.appendChild(right);
    pane.appendChild(head);

    view.headerName = name;
    view.headerMeta = session;
    view.headerTaskLine = task;
    view.planCompleteBox = plan;
    view.lifecycleBtns = lifecycle;
    view.wakeChip = wake;

    updateHead(entry, status);
    updateLifecycleButtons(entry);
  }

  function updateHead(entry, status) {
    const dot = statusDotChar(entry);
    view.headerName.textContent = entry.name;
    view.headerMeta.textContent = `SESSION #${status.session}`;
    if (status.completed) {
      view.planCompleteBox.style.display = '';
      view.planCompleteBox.textContent = '✓ Plan complete' +
        (status.completion_summary ? ': ' + status.completion_summary : '');
      view.headerTaskLine.textContent = '';
    } else {
      view.planCompleteBox.style.display = 'none';
      if (status.task) {
        view.headerTaskLine.innerHTML =
          '<span class="label">Task</span>' + escapeHtml(status.task);
      } else {
        view.headerTaskLine.textContent = '';
      }
    }
    if (status.next_wake) {
      view.wakeChip.innerHTML = '<span class="pulse"></span>next wake · ' +
        escapeHtml(status.next_wake);
      view.wakeChip.style.display = '';
    } else {
      view.wakeChip.style.display = 'none';
    }
  }

  function updateLifecycleButtons(entry) {
    const sig = `${entry.source}|${entry.running}|${!!entry.config_error}`;
    if (sig === view.lastLifecycleSig) return;
    view.lastLifecycleSig = sig;
    const btns = view.lifecycleBtns;
    btns.innerHTML = '';
    const disabled = entry.source === 'external';
    if (entry.source === 'workspace') {
      if (entry.running) {
        btns.appendChild(btn('wake', () => lifecycle(entry.id, 'wake'), 'primary'));
        btns.appendChild(btn('stop', () => lifecycle(entry.id, 'stop')));
        btns.appendChild(btn('restart', () => lifecycle(entry.id, 'restart')));
      } else if (!entry.config_error) {
        btns.appendChild(btn('start', () => lifecycle(entry.id, 'start'), 'primary'));
      }
      if (!entry.config_error) {
        btns.appendChild(btn('reset', () => confirmReset(entry.id, entry.name), 'danger'));
      }
    } else if (!disabled) {
      btns.appendChild(btn('wake', () => lifecycle(entry.id, 'wake'), 'primary'));
    } else {
      btns.appendChild(btn('wake', () => lifecycle(entry.id, 'wake'), 'primary'));
    }
  }

  function confirmReset(id, name) {
    const msg = `Reset "${name}"?\n\nThis will:\n  • stop the daemon if running\n  • archive cryo.log and cryo-agent.log to history/<timestamp>/\n  • start a new session (session counter resets to #1)\n\nThis cannot be undone.`;
    if (window.confirm(msg)) lifecycle(id, 'reset');
  }

  async function lifecycle(id, action) {
    try {
      const opts = { method: 'POST' };
      if (action === 'wake') {
        opts.headers = { 'Content-Type': 'application/json' };
        opts.body = JSON.stringify({});
      }
      const resp = await fetchJSON(`/api/chambers/${id}/${action}`, opts);
      toast(resp.message || action, resp.ok ? '' : 'error');
      await loadChambers();
      if (state.currentId === id) await buildDetail(id);
    } catch (e) {
      toast(e.message, 'error');
    }
  }

  function messageKey(m) {
    return `${m.direction}|${m.timestamp}|${m.from}|${hash32(m.body || '')}`;
  }

  function dayKey(ts) {
    return (ts || '').slice(0, 10); // YYYY-MM-DD
  }

  function buildMessageRow(m) {
    const row = document.createElement('div');
    row.className = 'msg ' + (m.direction === 'inbox' ? 'inbox' : 'outbox');
    row.dataset.key = messageKey(m);
    row.dataset.day = dayKey(m.timestamp);
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    const from = document.createElement('span');
    from.className = 'from';
    from.textContent = m.direction === 'inbox' ? m.from : `${m.from || 'chamber'} → ${m.to || 'out'}`;
    const ts = document.createElement('span');
    ts.textContent = (m.timestamp || '').slice(11, 16);
    meta.appendChild(from);
    meta.appendChild(ts);
    const body = document.createElement('div');
    body.className = 'msg-body';
    body.textContent = m.body || '';
    row.appendChild(meta);
    row.appendChild(body);
    return row;
  }

  function buildDayMarker(day) {
    const el = document.createElement('div');
    el.className = 'day-marker';
    el.dataset.day = day;
    el.textContent = day;
    return el;
  }

  function appendMessages(box, messages) {
    let currentDay = box.lastChild?.dataset?.day || null;
    for (const m of messages) {
      const d = dayKey(m.timestamp);
      if (d !== currentDay) {
        box.appendChild(buildDayMarker(d));
        currentDay = d;
      }
      box.appendChild(buildMessageRow(m));
      view.lastMsgKey = messageKey(m);
    }
  }

  function buildThread(pane, messages) {
    const box = document.createElement('div');
    box.className = 'thread';
    pane.appendChild(box);
    view.msgBox = box;
    appendMessages(box, messages || []);
    // Scroll newest into view:
    box.scrollTop = box.scrollHeight;
  }

  function isAtBottom(el) {
    return (el.scrollHeight - el.scrollTop - el.clientHeight) < 40;
  }

  function updateMessages(messages) {
    if (!view.msgBox) return;
    const box = view.msgBox;
    const wasAtBottom = isAtBottom(box);
    let startAt = 0;
    if (view.lastMsgKey) {
      const idx = messages.findIndex(m => messageKey(m) === view.lastMsgKey);
      if (idx < 0) {
        box.innerHTML = '';
        appendMessages(box, messages);
        box.scrollTop = box.scrollHeight;
        return;
      }
      startAt = idx + 1;
    }
    appendMessages(box, messages.slice(startAt));
    if (wasAtBottom) box.scrollTop = box.scrollHeight;
  }

  function buildCompose(pane, id) {
    const wrap = document.createElement('div');
    wrap.className = 'compose';
    wrap.innerHTML = `
      <div class="compose-inner">
        <textarea id="send-body" rows="1" placeholder="Send a message to the chamber…"></textarea>
        <div class="controls">
          <div class="hint">⌘↵</div>
          <button class="send">Send</button>
        </div>
      </div>`;
    pane.appendChild(wrap);
    const ta   = wrap.querySelector('#send-body');
    const send = wrap.querySelector('.send');
    async function submit() {
      const body = ta.value.trim();
      if (!body) return;
      try {
        await fetchJSON(`/api/chambers/${id}/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body }),
        });
        ta.value = '';
      } catch (e) { toast(e.message, 'error'); }
    }
    send.addEventListener('click', submit);
    ta.addEventListener('keydown', e => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); submit(); }
    });
  }

  function initDrawerTabs() {
    const tabs   = document.querySelectorAll('.drawer-tab');
    const panels = document.querySelectorAll('.drawer-body');
    tabs.forEach(tab => {
      tab.addEventListener('click', () => {
        const name = tab.getAttribute('data-tab');
        tabs.forEach(t => t.classList.toggle('active', t === tab));
        panels.forEach(p => {
          p.classList.toggle('hidden', p.getAttribute('data-panel') !== name);
        });
        if (name === 'log' && view && view.logEl) {
          view.logEl.scrollTop = view.logEl.scrollHeight;
        }
      });
    });
  }

  function todoSignature(todos) {
    if (!todos || !todos.length) return '0:';
    return todos.length + ':' + todos.map(t => `${t.id}|${t.done ? 1 : 0}|${t.at || ''}`).join(',');
  }

  function renderTodos(todos) {
    const sig = todoSignature(todos);
    if (sig === view.lastTodoSig) return;
    view.lastTodoSig = sig;
    const box = document.getElementById('panel-todos');
    const pending = (todos || []).filter(t => !t.done).length;
    const done    = (todos || []).filter(t =>  t.done).length;
    box.innerHTML = '';
    const title = document.createElement('div');
    title.className = 'section-title';
    title.innerHTML = `Todos <span class="count">${pending} pending · ${done} done</span>`;
    box.appendChild(title);
    const list = document.createElement('div');
    list.className = 'todos';
    for (const t of (todos || [])) {
      const row = document.createElement('div');
      row.className = 'todo' + (t.done ? ' done' : '');
      const check = document.createElement('span');
      check.className = 'check';
      const text = document.createElement('span');
      text.className = 'text';
      text.textContent = t.text;
      row.appendChild(check);
      row.appendChild(text);
      if (t.at) {
        const when = document.createElement('span');
        when.className = 'when' + (t.at_soon ? ' soon' : '');
        when.textContent = t.at;
        row.appendChild(when);
      }
      list.appendChild(row);
    }
    box.appendChild(list);
    document.getElementById('todos-count').textContent = pending;
  }

  function syncSignature(sync) {
    if (!sync || !sync.length) return '0:';
    return sync.length + ':' + sync.map(s =>
      `${s.backend}|${s.running}|${s.installed}|${s.target}|${s.last_pushed_session ?? ''}`
    ).join(',');
  }

  async function syncToggle(id, backend, running) {
    if (running) {
      if (!window.confirm(`Stop ${backend} sync and uninstall its service?`)) return false;
    }
    try {
      const resp = await fetchJSON(
        `/api/chambers/${id}/sync/${backend}/${running ? 'stop' : 'start'}`,
        { method: 'POST' }
      );
      toast(resp.message || (running ? 'stopped' : 'started'), resp.ok ? '' : 'error');
      return true;
    } catch (e) {
      toast(e.message, 'error');
      return false;
    }
  }

  function renderSync(id, sync) {
    const sig = syncSignature(sync);
    if (sig === view.lastSyncSig) return;
    view.lastSyncSig = sig;
    const box = document.getElementById('panel-sync');
    box.innerHTML = '';
    const running = (sync || []).filter(s => s.running).length;
    const title = document.createElement('div');
    title.className = 'section-title';
    title.innerHTML = `Sync backends <span class="count">${running} of ${(sync || []).length} running</span>`;
    box.appendChild(title);
    const list = document.createElement('div');
    list.className = 'sync-list';

    for (const s of (sync || [])) {
      const card = document.createElement('div');
      card.className = 'sync-card';
      card.innerHTML = `
        <div class="sync-card-head">
          <div class="sync-card-name">
            ${escapeHtml(s.backend)}
            <span class="badge${s.running ? '' : ' stopped'}">${s.running ? 'running' : 'off'}</span>
          </div>
          <label class="sync-toggle">
            <input type="checkbox" ${s.running ? 'checked' : ''}>
            <span class="slider"></span>
          </label>
        </div>
        <div class="sync-target">${escapeHtml(s.target || '—')}</div>
        <div class="sync-foot">
          <span>${s.last_pushed_session != null
            ? 'last push · session #' + s.last_pushed_session
            : (s.configured ? 'configured' : '')}</span>
        </div>`;
      const cb = card.querySelector('input[type=checkbox]');
      cb.addEventListener('change', async () => {
        // Revert immediately — real state re-arrives via SSE `status` event.
        const prev = s.running;
        cb.checked = prev; // lock UI until backend confirms
        const ok = await syncToggle(id, s.backend, prev);
        if (!ok) cb.checked = prev;
      });
      list.appendChild(card);
    }
    box.appendChild(list);

    const help = document.createElement('div');
    help.className = 'sync-help';
    help.textContent =
      'Toggles start / stop the OS service (launchd on macOS, systemd on Linux). ' +
      'Push and pull happen automatically on message events.';
    box.appendChild(help);
  }

  function renderLog(status) {
    const box = document.getElementById('panel-log');
    box.innerHTML = '';
    const title = document.createElement('div');
    title.className = 'section-title';
    title.innerHTML = 'cryo.log <span class="count">tail · live</span>';
    box.appendChild(title);
    const wrap = document.createElement('div');
    wrap.className = 'log-wrap';
    const log = document.createElement('pre');
    log.className = 'log';
    log.id = 'log';
    log.textContent = status.log_tail || '';
    const foot = document.createElement('div');
    foot.className = 'log-foot';
    foot.innerHTML =
      '<span><span class="dot-live"></span>streaming · SSE</span>';
    wrap.appendChild(log);
    wrap.appendChild(foot);
    box.appendChild(wrap);
    view.logEl = log;
    log.scrollTop = log.scrollHeight;
  }

  function appendLogLine(line) {
    if (!view || !view.logEl) return;
    const el = view.logEl;
    const atBottom = (el.scrollHeight - el.scrollTop - el.clientHeight) < 30;
    el.textContent += (el.textContent ? '\n' : '') + line;
    if (atBottom) el.scrollTop = el.scrollHeight;
  }

  async function buildDetail(id) {
    const entry = state.chambers.find(c => c.id === id);
    if (!entry) return;
    const pane = document.getElementById('pane');
    const [status, messages, todos, sync] = await Promise.all([
      fetchJSON(`/api/chambers/${id}/status`),
      fetchJSON(`/api/chambers/${id}/messages`),
      fetchJSON(`/api/chambers/${id}/todos`),
      fetchJSON(`/api/chambers/${id}/sync`),
    ]);
    pane.innerHTML = '';
    view = newView();
    view.chamberId = id;
    buildHead(pane, entry, status);
    buildThread(pane, messages);
    buildCompose(pane, id);
    renderTodos(todos);
    renderSync(id, sync);
    renderLog(status);
    document.getElementById('drawer').hidden = false;
  }

  async function updateDetail(id, parts) {
    if (!view || view.chamberId !== id) return;
    const fetches = {};
    if (parts.status)   fetches.status   = fetchJSON(`/api/chambers/${id}/status`);
    if (parts.messages) fetches.messages = fetchJSON(`/api/chambers/${id}/messages`);
    if (parts.todos)    fetches.todos    = fetchJSON(`/api/chambers/${id}/todos`);
    if (parts.sync)     fetches.sync     = fetchJSON(`/api/chambers/${id}/sync`);
    const entries = await Promise.allSettled(
      Object.entries(fetches).map(async ([k, p]) => [k, await p])
    );
    const data = {};
    for (const r of entries) {
      if (r.status === 'fulfilled') data[r.value[0]] = r.value[1];
    }
    const entry = state.chambers.find(c => c.id === id);
    if (entry && data.status) {
      updateHead(entry, data.status);
      updateLifecycleButtons(entry);
      renderLog(data.status); // refreshes log_tail baseline
    }
    if (data.sync)     renderSync(id, data.sync);
    if (data.todos)    renderTodos(data.todos);
    if (data.messages) updateMessages(data.messages);
  }

  async function selectChamber(id) {
    state.currentId = id;
    window.history.pushState({}, '', `/c/${id}`);
    renderRail();
    await buildDetail(id);
  }

  document.getElementById('refresh').addEventListener('click', async () => {
    try {
      state.chambers = await fetchJSON('/api/chambers/refresh', { method: 'POST' });
      renderRail();
    } catch (e) { toast(e.message, 'error'); }
  });

  initDrawerTabs();

  const evt = new EventSource('/api/events');
  evt.addEventListener('message', async e => {
    const d = JSON.parse(e.data);
    if (state.currentId === d.chamber_id) {
      await updateDetail(state.currentId, { messages: true });
    }
    await loadChambers();
  });
  evt.addEventListener('status', async e => {
    const d = JSON.parse(e.data);
    await loadChambers();
    if (state.currentId === d.chamber_id) {
      await updateDetail(state.currentId, { status: true, todos: true, sync: true });
    }
  });
  evt.addEventListener('log', e => {
    const d = JSON.parse(e.data);
    if (state.currentId === d.chamber_id) appendLogLine(d.line);
  });
  evt.addEventListener('index', async () => { await loadChambers(); });

  // Expose for subsequent task wiring.
  window.__hub = { state, fetchJSON, toast, escapeHtml, hash32, renderRail, loadChambers, selectChamber };

  (async () => {
    await loadChambers();
    const urlId = urlChamberId();
    if (urlId && state.chambers.some(c => c.id === urlId)) {
      await selectChamber(urlId);
    }
  })();
})();
</script>
