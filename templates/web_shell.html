<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cryohub</title>
<link rel="icon" type="image/svg+xml" href="/assets/mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<!-- Vendored rendering libs (served by cryohub at /assets/vendor/* — no CDN
     dependency; see templates/vendor/README.md). `defer` so the UI renders
     immediately and bodies fall back to plain text if the libs are missing. -->
<link rel="stylesheet" href="/assets/vendor/katex.min.css">
<script defer src="/assets/vendor/katex.min.js"></script>
<script defer src="/assets/vendor/marked.min.js"></script>
<script defer src="/assets/vendor/purify.min.js"></script>
<link rel="stylesheet" href="/assets/web.css">
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img src="/assets/logo.svg" class="logo" alt="cryochamber">
  </div>
  <button class="lang-btn" id="lang-btn" data-i18n-title="lang.toggle_title" title="Language / 语言">EN</button>
</div>

<div class="app">

  <aside class="rail">
    <div class="rail-head">
      <span class="title" data-i18n="rail.title">Chambers</span>
      <span class="count" id="rail-count">0</span>
      <button class="rail-add" id="chamber-new" data-i18n-title="rail.new_title" title="New chamber">+</button>
    </div>
    <div class="rail-list" id="chamber-list"></div>
    <div class="rail-foot">
      <span data-i18n="rail.autorefresh">auto-refresh · on</span>
      <span><button id="refresh">⟳</button></span>
    </div>
  </aside>

  <section class="center" id="pane">
    <div class="pane-empty">
      <div data-i18n="pane.empty">Pick a chamber from the rail</div>
    </div>
  </section>

  <aside class="drawer" id="drawer" hidden>
    <div class="drawer-tabs">
      <div class="drawer-tab active" data-tab="todos"><span data-i18n="tab.todos">Todos</span><span class="tab-count" id="todos-count">0</span></div>
      <div class="drawer-tab" data-tab="sync" data-i18n="tab.sync">Sync</div>
      <div class="drawer-tab" data-tab="settings" data-i18n="tab.settings">Settings</div>
      <div class="drawer-tab" data-tab="log" data-i18n="tab.log">Log</div>
    </div>
    <div class="drawer-body" data-panel="todos" id="panel-todos"></div>
    <div class="drawer-body hidden" data-panel="sync" id="panel-sync"></div>
    <div class="drawer-body hidden" data-panel="settings" id="panel-settings"></div>
    <div class="drawer-body hidden" data-panel="log" id="panel-log"></div>
  </aside>

</div>

<div id="toast" class="toast"></div>

<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h3 id="modal-title" data-i18n="modal.title">New chamber</h3>
    <div class="modal-field">
      <label for="modal-name-input" data-i18n="modal.name">Name</label>
      <input id="modal-name-input" type="text" data-i18n-placeholder="ph.name" placeholder="my-chamber" autocomplete="off">
    </div>
    <details class="modal-provider-details" id="modal-provider-details">
      <summary data-i18n="modal.provider_summary">API key provider</summary>
      <div class="modal-field">
        <label for="modal-provider-input" data-i18n="modal.provider">Provider</label>
        <input id="modal-provider-input" list="modal-provider-options" type="text" data-i18n-placeholder="ph.provider" placeholder="provider-id" autocomplete="off">
        <datalist id="modal-provider-options"></datalist>
      </div>
      <div class="modal-field">
        <label for="modal-model-input" data-i18n="modal.model">Model</label>
        <input id="modal-model-input" list="modal-model-options" type="text" data-i18n-placeholder="ph.model" placeholder="model-id" autocomplete="off">
        <datalist id="modal-model-options"></datalist>
      </div>
      <div class="modal-field">
        <label for="modal-api-key-input" data-i18n="modal.apikey">API key</label>
        <input id="modal-api-key-input" type="password" data-i18n-placeholder="ph.apikey" placeholder="sk-..." autocomplete="off">
      </div>
      <div class="modal-model-status" id="modal-model-status"></div>
    </details>
    <div class="modal-error" id="modal-error" hidden></div>
    <div class="modal-actions">
      <button id="modal-cancel" class="modal-btn" data-i18n="modal.cancel">Cancel</button>
      <button id="modal-create" class="modal-btn modal-btn-primary" data-i18n="modal.create">Create</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="token-gate" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="token-gate-title">
    <h3 id="token-gate-title">Access token required</h3>
    <p class="token-gate-hint">This hub runs in public mode. Paste the token from
      <code>cryohub token owner</code> to continue. Invite tokens open the chat
      console, not this control panel.</p>
    <div class="modal-field">
      <label for="token-gate-input">Token</label>
      <input id="token-gate-input" type="password" placeholder="hex token" autocomplete="off" autocapitalize="none" spellcheck="false">
    </div>
    <div class="modal-error" id="token-gate-error" hidden></div>
    <div class="modal-actions">
      <button id="token-gate-submit" class="modal-btn modal-btn-primary">Connect</button>
    </div>
  </div>
</div>

      'confirm.reset_body': '此操作将：\n  • 若守护进程正在运行则将其停止\n  • 将日志、todo.json、NOTES.md、消息和 timer.json 归档到 history/<时间戳>/\n  • 停止该 chamber —— 按「启动」开始新的会话\n\n此操作不可撤销。',

      'todos.history': '历史记录 ({n})',
      'sync.title': '消息同步',
      'sync.running': '运行中',
      'sync.off': '已关闭',
      'sync.last_push': '上次推送 · 第 {n} 次会话',
      'sync.configured': '已配置',
      'sync.empty': '该 chamber 未配置消息同步。',
      'digest.title': '每日摘要',
      'digest.unknown': '未知',
      'digest.counts': (a) => `${a.n} 次会话 · ${a.m} 次失败`,
      'ctab.messages': '消息',
      'ctab.plan': '计划',
      'ctab.notes': 'Agent 笔记',
      'marker.session': '第 {n} 次会话',
      'compose.placeholder': '向 chamber 发送消息……（回车换行，⌘↵ 发送）',
      'compose.hint': '⌘↵',
      'compose.send': '发送',
      'thread.history': '历史记录（更早的 {n} 条）',
      'notes.empty': '该 chamber 中没有 NOTES.md。',
      'plan.empty': '该 chamber 中没有 plan.md。',
      'settings.empty': '该 chamber 中没有 cryo.toml。',
      'settings.unparseable': '（无法解析 cryo.toml —— 请在磁盘上打开它）',
    },
  };

  function detectLang() {
    try {
      const saved = localStorage.getItem('hub:lang');
      if (saved && I18N[saved]) return saved;
    } catch (e) {}
    const nav = (navigator.languages && navigator.languages[0]) || navigator.language || 'en';
    return String(nav).toLowerCase().startsWith('zh') ? 'zh' : 'en';
  }

  let LANG = detectLang();

  function t(key, args) {
    let v = (I18N[LANG] && I18N[LANG][key] != null) ? I18N[LANG][key] : I18N.en[key];
    if (v == null) return key;
    if (typeof v === 'function') return v(args || {});
    if (args) {
      v = String(v).replace(/\{(\w+)\}/g, (_, k) => (args[k] != null ? args[k] : '{' + k + '}'));
    }
    return v;
  }

  function applyStaticI18n() {
    document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(el => {
      el.textContent = t(el.getAttribute('data-i18n'));
    });
    document.querySelectorAll('[data-i18n-title]').forEach(el => {
      el.title = t(el.getAttribute('data-i18n-title'));
    });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
    });
    const lb = document.getElementById('lang-btn');
    if (lb) lb.textContent = LANG === 'zh' ? 'EN' : '中文';
  }

  applyStaticI18n();
  const langBtn = document.getElementById('lang-btn');
  if (langBtn) {
    langBtn.addEventListener('click', () => {
      const next = LANG === 'zh' ? 'en' : 'zh';
      try { localStorage.setItem('hub:lang', next); } catch (e) {}
      // Reload so every static + dynamically-rendered string re-renders
      // against the new language without re-running each render by hand.
      window.location.reload();
    });
  }

  function urlChamberId() {
    const m = window.location.pathname.match(/^\/c\/(.+)$/);
    return m ? m[1] : null;
  }

  // In --public mode every /api route wants a bearer token. The dashboard has
  // no login screen, so the token lives in localStorage and a blocking modal
  // (the token gate) collects it the first time the hub answers 401. The token
  // rides in the Authorization header only — never in a URL.
  const TOKEN_KEY = 'cryohub.dashboard.token';
  function storedToken() {
    // sessionStorage is the fallback for browsers that block persistent
    // storage: the token then lives for this tab only.
    try { if (localStorage.getItem(TOKEN_KEY)) return localStorage.getItem(TOKEN_KEY); } catch (e) { /* blocked */ }
    try { return sessionStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
  }
  function dropToken() {
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) { /* blocked */ }
    try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* blocked */ }
  }
  function authHeaders(extra) {
    const t = storedToken();
    return t ? { Authorization: 'Bearer ' + t, ...(extra || {}) } : (extra || {});
  }
  function showTokenGate() {
    document.getElementById('token-gate').hidden = false;
    document.getElementById('token-gate-input').focus();
  }
  (function initTokenGate() {
    const input = document.getElementById('token-gate-input');
    const errBox = document.getElementById('token-gate-error');
    function fail(msg) {
      errBox.textContent = msg;
      errBox.hidden = false;
    }
    async function submit() {
      const token = input.value.trim();
      errBox.hidden = true;
      if (!token) return;
      // whoami is the cheapest authenticated route: 200 proves the token,
      // 401 means it is wrong (or revoked) and nothing was changed.
      const res = await fetch('/api/whoami', { headers: { Authorization: 'Bearer ' + token } })
        .catch(() => null);
      if (!res || !res.ok) {
        fail('That token was not accepted. Check it and try again.');
        return;
      }
      // Owner only. An invite would pass whoami but the panel is built on
      // owner-only routes (sync, lifecycle, new-chamber) — accepting it here
      // would hand the guest a dashboard that breaks on first click.
      const who = await res.json().catch(() => ({}));
      if (who.role !== 'owner') {
        fail('That is an invite token. The control panel needs the owner token; invite links open the chat console instead.');
        return;
      }
      let saved = false;
      try { localStorage.setItem(TOKEN_KEY, token); saved = true; } catch (e) { /* blocked */ }
      if (!saved) {
        try { sessionStorage.setItem(TOKEN_KEY, token); saved = true; } catch (e) { /* blocked */ }
      }
      if (!saved) {
        // Reloading now would discard the only copy of the token and re-raise
        // the gate forever; say what is actually wrong instead.
        fail('Your browser is blocking site storage; allow it for this site to use the dashboard.');
        return;
      }
      // Reload rather than re-run boot piecemeal: every fetch and the event
      // stream pick up the token uniformly on a fresh start.
      window.location.reload();
    }
    document.getElementById('token-gate-submit').addEventListener('click', submit);
    input.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  })();

  async function fetchJSON(url, opts) {
    opts = opts || {};
    const method = (opts.method || 'GET').toUpperCase();
    // CSRF guard: the daemon rejects state-changing requests that don't carry
    // this custom header (a cross-origin simple request can't set it). GET/HEAD
    // are safe and exempt.
    if (method !== 'GET' && method !== 'HEAD') {
      opts.headers = { 'X-Cryo-CSRF': '1', ...(opts.headers || {}) };
    }
    opts.headers = authHeaders(opts.headers);
    const res = await fetch(url, opts);
    if (res.status === 401) {
      // Wrong, revoked, or absent token: drop it so the gate re-prompts
      // instead of replaying a dead credential forever.
      dropToken();
      showTokenGate();
      throw new Error(`${url}: 401`);
    }
    let data = null;
    try {
      data = await res.json();
    } catch (e) {
      if (res.ok) throw e;
    }
    if (!res.ok) throw new Error((data && data.message) || `${url}: ${res.status}`);
    if (data && data.ok === false) throw new Error(data.message || 'Request failed');
    return data;
  }

  function toast(msg, kind) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast' + (kind === 'error' ? ' error' : '');
    el.style.display = 'block';
    setTimeout(() => { el.style.display = 'none'; }, 4000);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // --- Rich message bodies: safe markdown + KaTeX math ---
  // Agent replies may contain markdown and LaTeX. Pipeline:
  //   1. protect fenced blocks / inline code / escaped `\$` behind tokens, so
  //      code contents are never treated as math;
  //   2. render math with KaTeX *before* the markdown pass (so `$x_i$` can't
  //      be mangled into emphasis), behind placeholder tokens;
  //   3. drop image syntax (the hub has no attachment endpoint yet) — the alt
  //      text survives as plain text;
  //   4. restore code, run marked (raw HTML tokens escaped via renderer
  //      override), DOMPurify-sanitize, then restore the KaTeX HTML.
  // Raw HTML in the source can never reach the DOM unescaped, so agent output
  // cannot inject markup. Returns null when the rendering libs aren't loaded
  // yet; the caller then falls back to plain text.
  const MATH_L = '\uE000', MATH_R = '\uE001';
  const CODE_L = '\uE002', CODE_R = '\uE003';
  const ESC_D = '\uE004';
  const MATH_PAT =
    /\$\$([\s\S]+?)\$\$|\\\[([\s\S]+?)\\\]|\\\(([\s\S]+?)\\\)|\$([^\s$](?:[^$\n]*[^\s$])?)\$/g;
  let markedInitialized = false;

  function richTextAvailable() {
    return !!(window.marked && window.katex && window.DOMPurify);
  }

  function renderMessageBody(md) {
    if (!richTextAvailable()) return null;
    if (!markedInitialized) {
      markedInitialized = true;
      // Escape raw HTML tokens (e.g. `<script>`) instead of letting marked
      // pass them through; avoids a pre-escape that would double-escape code.
      window.marked.use({ renderer: { html: text => escapeHtml(text) } });
    }
    const src = String(md);
    // 1. Protect code spans / fenced blocks and escaped dollars.
    const code = [];
    let text = src
      .replace(/(`{3,}|~{3,})[\s\S]*?\1|(`+)[^`\n]*?\2/g, m => {
        code.push(m);
        return CODE_L + (code.length - 1) + CODE_R;
      })
      .replace(/\\\$/g, ESC_D);
    // 2. Render math before the markdown pass.
    const math = [];
    text = text.replace(MATH_PAT, (m, dd, di, ii, si) => {
      const raw = dd != null ? dd : (di != null ? di : (ii != null ? ii : si));
      const display = dd != null || di != null;
      let html;
      try {
        html = window.katex.renderToString(raw, { displayMode: display, throwOnError: false });
      } catch (_e) {
        html = escapeHtml(raw); // malformed math degrades to literal text
      }
      math.push(html);
      return MATH_L + (math.length - 1) + MATH_R;
    });
    // 3. Drop image syntax — the alt text stays as plain text.
    text = text.replace(/!\[([^\]]*)\]\([^)]*\)/g, '$1');
    // 4. Restore code and escaped dollars, then render markdown.
    text = text
      .replace(new RegExp(CODE_L + '(\\d+)' + CODE_R, 'g'), (_, i) => code[Number(i)] || '')
      .replace(new RegExp(ESC_D, 'g'), '\\$');
    const html = window.marked.parse(text, { gfm: true, breaks: true });
    const clean = window.DOMPurify.sanitize(html);
    return clean.replace(new RegExp(MATH_L + '(\\d+)' + MATH_R, 'g'), (_, i) => math[Number(i)] || '');
  }

  // The rendering libs load with `defer`, so they may land after the first
  // paint on a slow or offline connection. When they arrive, upgrade the open
  // thread from plain text to rich rendering without losing the bottom anchor.
  window.addEventListener('load', () => {
    if (richTextAvailable() || !view) return;
    const upgrade = () => {
      if (!richTextAvailable() || !view || !view.msgBox) return;
      const box = view.msgBox;
      const wasAtBottom = isAtBottom(box);
      renderThreadContents();
      if (wasAtBottom) box.scrollTop = box.scrollHeight;
    };
    setTimeout(upgrade, 500);
    setTimeout(upgrade, 2000);
    setTimeout(upgrade, 6000);
  });

  function hash32(s) {
    let h = 0x811c9dc5 >>> 0;
    for (let i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 0x01000193) >>> 0;
    }
    return h.toString(36);
  }

  function statusClass(entry) {
    if (entry.config_error) return 'error';
    if (entry.agent_running && entry.running) return 'running-active';
    if (entry.completed) return 'complete';
    if (entry.running) return 'running';
    return 'stopped';
  }

  // Server emits wake/scheduled times as 'YYYY-MM-DDTHH:MM' in local time.
  // Browsers parse date-time strings without an offset as local time, so
  // `new Date(iso)` matches the daemon's `chrono::Local` clock.
  function formatWakeRelative(iso, nowMs) {
    if (!iso) return null;
    const target = new Date(iso);
    const targetMs = target.getTime();
    if (!Number.isFinite(targetMs)) return null;
    const diffMin = Math.round((targetMs - (nowMs ?? Date.now())) / 60000);
    let text;
    if (diffMin <= -60 * 24) text = t('time.ago.d', { n: Math.round(-diffMin / (60 * 24)) });
    else if (diffMin <= -60)  text = t('time.ago.h', { n: Math.round(-diffMin / 60) });
    else if (diffMin < 0)     text = t('time.ago.m', { n: -diffMin });
    else if (diffMin < 1)     text = t('time.now');
    else if (diffMin < 60)    text = t('time.in_m', { n: diffMin });
    else if (diffMin < 60 * 24) {
      const h = Math.floor(diffMin / 60);
      const m = diffMin % 60;
      text = m > 0 ? t('time.in_hm', { n: h, m }) : t('time.in_h', { n: h });
    } else text = t('time.in_d', { n: Math.floor(diffMin / (60 * 24)) });
    return { text, soon: diffMin >= 0 && diffMin <= 60 };
  }

  // Renders a wake-time element with a live-updating relative label
  // (`in 5m`). The absolute ISO is stashed on the element so the 30s
  // ticker can re-render in place without re-fetching, and exposed via
  // `title` so operators can still see the exact time on hover.
  function applyWake(el, iso, prefix) {
    prefix = prefix || '';
    if (!iso) {
      delete el.dataset.wakeIso;
      delete el.dataset.wakePrefix;
      el.removeAttribute('title');
      el.classList.remove('soon');
      el.textContent = '';
      return;
    }
    el.dataset.wakeIso = iso;
    if (prefix) el.dataset.wakePrefix = prefix;
    else delete el.dataset.wakePrefix;
    el.title = iso;
    const rel = formatWakeRelative(iso);
    el.textContent = prefix + (rel ? rel.text : iso);
    el.classList.toggle('soon', !!(rel && rel.soon));
  }

  function refreshWakeRelatives() {
    document.querySelectorAll('[data-wake-iso]').forEach(el => {
      const iso = el.dataset.wakeIso;
      const prefix = el.dataset.wakePrefix || '';
      const rel = formatWakeRelative(iso);
      if (!rel) return;
      el.textContent = prefix + rel.text;
      el.classList.toggle('soon', rel.soon);
    });
  }

  function buildChamberRow(c) {
    const row = document.createElement('div');
    row.className = 'chamber' + (c.id === state.currentId ? ' active' : '');
    row.dataset.id = c.id;
    row.title = c.path || c.path_hint || c.name;

    const row1 = document.createElement('div');
    row1.className = 'chamber-row1';
    const dot = document.createElement('span');
    dot.className = 'status-dot ' + statusClass(c);
    const name = document.createElement('span');
    name.className = 'chamber-name';
    name.textContent = c.name;
    name.title = c.path || c.path_hint || c.name;
    row1.appendChild(dot);
    row1.appendChild(name);
    if (c.has_open_question) {
      const badge = document.createElement('span');
      badge.className = 'question-badge';
      badge.textContent = '?';
      badge.title = t('question.badge_title');
      row1.appendChild(badge);
    }
    row.appendChild(row1);

    if (c.next_wake_display) {
      const meta = document.createElement('div');
      meta.className = 'chamber-meta';
      const when = document.createElement('span');
      when.className = c.running ? 'when' : 'when muted';
      applyWake(when, c.next_wake_display);
      meta.appendChild(when);
      row.appendChild(meta);
    }

    row.addEventListener('click', () => selectChamber(c.id));
    return row;
  }

  function renderRail() {
    const list = document.getElementById('chamber-list');
    list.innerHTML = '';
    // Split active vs completed: completed plans get folded into a
    // collapsible `<details>` section, same pattern as the TODO panel's
    // "History" fold. Keeps the rail focused on chambers that still need
    // attention.
    const active = [];
    const completed = [];
    const archived = [];
    for (const c of state.chambers) {
      // Archived is a display state the operator chose explicitly, so it wins
      // over completion — an archived chamber folds into "Archived" regardless
      // of plan status.
      if (c.archived) { archived.push(c); continue; }
      // Group by completion alone. The daemon can still be winding down
      // (running=true) right after `hibernate --complete`; `statusClass` and
      // the header glyph already prioritise "completed" in that window, so
      // the fold must too — otherwise the rail shows the chamber as active
      // while every other signal says it's done.
      if (c.completed) completed.push(c);
      else active.push(c);
    }
    const runningFirst = (a, b) => {
      const rank = e => (e.running ? 0 : 1);
      const ra = rank(a), rb = rank(b);
      if (ra !== rb) return ra - rb;
      return a.name.localeCompare(b.name);
    };
    active.sort(runningFirst);
    completed.sort((a, b) => a.name.localeCompare(b.name));

    for (const c of active) list.appendChild(buildChamberRow(c));

    if (completed.length) {
      const details = document.createElement('details');
      details.className = 'chamber-history';
      // Keep the fold open if (a) the user had it open last render, or (b)
      // the currently-selected chamber lives inside it — otherwise clicking
      // Complete on the active chamber would silently fold the selection
      // away and the operator loses visual feedback of what's selected.
      const selectedIsInside = completed.some(c => c.id === state.currentId);
      if (state.chamberHistoryOpen || selectedIsInside) details.open = true;
      details.addEventListener('toggle', () => {
        state.chamberHistoryOpen = details.open;
      });
      const summary = document.createElement('summary');
      summary.textContent = t('rail.completed', { n: completed.length });
      details.appendChild(summary);
      for (const c of completed) details.appendChild(buildChamberRow(c));
      list.appendChild(details);
    }

    if (archived.length) {
      archived.sort((a, b) => a.name.localeCompare(b.name));
      const details = document.createElement('details');
      details.className = 'chamber-history';
      const selectedIsInside = archived.some(c => c.id === state.currentId);
      if (state.chamberArchivedOpen || selectedIsInside) details.open = true;
      details.addEventListener('toggle', () => {
        state.chamberArchivedOpen = details.open;
      });
      const summary = document.createElement('summary');
      summary.textContent = t('rail.archived', { n: archived.length });
      details.appendChild(summary);
      for (const c of archived) details.appendChild(buildChamberRow(c));
      list.appendChild(details);
    }

    document.getElementById('rail-count').textContent = state.chambers.length;
  }

  async function loadChambers() {
    state.chambers = await fetchJSON('/api/chambers');
    renderRail();
  }

  async function refreshChamberIndex(options) {
    const silent = !!(options && options.silent);
    try {
      state.chambers = await fetchJSON('/api/chambers/refresh', { method: 'POST' });
      renderRail();
    } catch (e) {
      if (!silent) toast(e.message, 'error');
    }
  }

  let railRefreshTimer = null;
  function scheduleRailRefresh(chamberId) {
    if (railRefreshTimer) clearTimeout(railRefreshTimer);
    railRefreshTimer = setTimeout(async () => {
      railRefreshTimer = null;
      try {
        await loadChambers();
        if (state.currentId === chamberId) {
          await updateDetail(chamberId, { status: true, todos: true, sync: true });
        }
      } catch (e) {
        toast(e.message, 'error');
      }
    }, 250);
  }

  let view = null;

  function newView() {
    return {
      chamberId: null,
      headerName: null,
      headerMeta: null,
      headerTaskLine: null,
      planCompleteBox: null,
      lifecycleBtns: null,
      panels: { todos: null, sync: null, settings: null, log: null },
      syncEl: null,
      notesEl: null,
      notesLastHtml: null,
      planEl: null,
      planLastHtml: null,
      settingsEl: null,
      settingsLastSig: null,
      logEl: null,
      messagesBodyEl: null,
      planBodyEl: null,
      notesBodyEl: null,
      messagesUnreadEl: null,
      lastMsgKey: null,
      lastTodoSig: null,
      lastSyncSig: null,
      lastLifecycleSig: null,
      msgBox: null,
      allMessages: [],
      historyEl: null,
      historyCount: 0,
    };
  }

  function btn(label, onClick, cls, pending) {
    const b = document.createElement('button');
    b.textContent = label;
    if (cls) b.className = cls;
    b.disabled = !!pending;
    b.addEventListener('click', onClick);
    return b;
  }

  function statusDotChar(entry) {
    if (entry.config_error) return '✗';
    if (entry.completed) return '✓';
    return entry.running ? '●' : '○';
  }

  function formatSessionSummary(session, summary) {
    const text = String(summary || '').trim();
    if (!text) return '';
    const body = text.replace(/^Session\s+#?\d+\s*:\s*/i, '').trim();
    const prefix = Number(session) > 0 ? t('head.session_prefix', { n: session }) : '';
    return prefix + (body || text);
  }

  function buildHead(pane, entry, status) {
    const head = document.createElement('div');
    head.className = 'thread-head';

    const left = document.createElement('div');
    left.className = 'left';
    const title = document.createElement('div');
    title.className = 'title';
    const name = document.createElement('span');
    name.className = 'name';
    name.textContent = entry.name;
    if (entry.path) name.title = entry.path;
    const session = document.createElement('span');
    session.className = 'session';
    left.appendChild(title);
    title.appendChild(name);
    title.appendChild(session);

    const taskRow = document.createElement('div');
    taskRow.className = 'task-row';
    const task = document.createElement('div');
    task.className = 'task';
    taskRow.appendChild(task);
    left.appendChild(taskRow);

    const plan = document.createElement('div');
    plan.className = 'plan-complete';
    plan.style.display = 'none';
    left.appendChild(plan);

    const right = document.createElement('div');
    right.className = 'thread-actions';
    const wake = document.createElement('span');
    wake.className = 'wake-chip';
    const lifecycle = document.createElement('div');
    lifecycle.className = 'lifecycle';
    right.appendChild(wake);
    right.appendChild(lifecycle);

    head.appendChild(left);
    head.appendChild(right);
    pane.appendChild(head);

    view.headerName = name;
    view.headerMeta = session;
    view.headerTaskLine = task;
    view.planCompleteBox = plan;
    view.lifecycleBtns = lifecycle;
    view.wakeChip = wake;

    updateHead(entry, status);
    updateLifecycleButtons(entry);
  }

  function updateHead(entry, status) {
    const dot = statusDotChar(entry);
    view.headerName.textContent = entry.name;
    view.headerName.title = entry.path || '';
    const summary = status.session_summary || '';
    const displaySummary = formatSessionSummary(status.session, summary);
    view.headerMeta.textContent = displaySummary ? '' : t('head.session', { n: status.session });
    view.headerMeta.style.display = displaySummary ? 'none' : '';
    if (status.completed) {
      view.planCompleteBox.style.display = '';
      view.planCompleteBox.textContent = t('head.plan_complete') +
        (status.completion_summary ? ': ' + status.completion_summary : '');
      view.headerTaskLine.textContent = '';
      view.headerTaskLine.title = '';
    } else {
      view.planCompleteBox.style.display = 'none';
      if (displaySummary) {
        view.headerTaskLine.textContent = displaySummary;
        view.headerTaskLine.title = displaySummary;
      } else {
        view.headerTaskLine.textContent = '';
        view.headerTaskLine.title = '';
      }
    }
    if (entry.running && status.next_wake) {
      view.wakeChip.innerHTML = '';
      const pulse = document.createElement('span');
      pulse.className = 'pulse';
      const txt = document.createElement('span');
      view.wakeChip.appendChild(pulse);
      view.wakeChip.appendChild(txt);
      applyWake(txt, status.next_wake, t('wake.next_prefix'));
      view.wakeChip.style.display = '';
    } else {
      view.wakeChip.style.display = 'none';
    }
  }

  function updateLifecycleButtons(entry) {
    const pending = state.lifecyclePending[entry.id];
    const sig = `${entry.running}|${!!entry.config_error}|${!!entry.completed}|${!!entry.archived}|${!!pending}`;
    if (sig === view.lastLifecycleSig) return;
    view.lastLifecycleSig = sig;
    const btns = view.lifecycleBtns;
    btns.innerHTML = '';
    // Archived chambers are put away: the only action is to bring them back.
    // Unarchive leaves the chamber stopped; the operator then presses Launch.
    if (entry.archived) {
      btns.appendChild(btn(t('lc.unarchive'), () => lifecycle(entry.id, 'unarchive'), 'primary', pending));
      return;
    }
    if (entry.running) {
      btns.appendChild(btn(t('lc.stop'), () => lifecycle(entry.id, 'stop'), '', pending));
    } else if (!entry.config_error && !entry.completed) {
      // A completed plan has nothing to resume — hide Launch. Reset stays
      // available so the operator can archive the run and begin a new plan.
      btns.appendChild(btn(t('lc.launch'), () => lifecycle(entry.id, 'start'), 'primary', pending));
    }
    if (!entry.running && !entry.config_error) {
      btns.appendChild(btn(t('lc.reset'), () => confirmReset(entry.id, entry.name), 'danger', pending));
      // Archive is only offered once the daemon is stopped — the natural next
      // step after Stop. Reversible, so no confirm dialog.
      btns.appendChild(btn(t('lc.archive'), () => lifecycle(entry.id, 'archive'), '', pending));
    }
  }

  function setLifecyclePending(id, pending) {
    if (pending) {
      state.lifecyclePending[id] = true;
    } else {
      delete state.lifecyclePending[id];
    }
    if (view && view.chamberId === id && view.lifecycleBtns) {
      const entry = state.chambers.find(c => c.id === id);
      if (entry) updateLifecycleButtons(entry);
    }
  }

  function confirmReset(id, name) {
    const msg = t('confirm.reset_title', { name }) + '\n\n' + t('confirm.reset_body');
    if (window.confirm(msg)) lifecycle(id, 'reset');
  }

  // Toast fallback when the server provides no message: map the lifecycle
  // action to a localised status word.
  const ACTION_TOAST = {
    start: 'toast.started',
    stop: 'toast.stopped',
    wake: 'toast.woken',
    reset: 'lc.reset',
    archive: 'lc.archive',
    unarchive: 'lc.unarchive',
  };

  async function lifecycle(id, action) {
    if (state.lifecyclePending[id]) return;
    setLifecyclePending(id, true);
    try {
      const opts = { method: 'POST' };
      if (action === 'wake') {
        opts.headers = { 'Content-Type': 'application/json' };
        opts.body = JSON.stringify({});
      }
      const resp = await fetchJSON(`/api/chambers/${id}/${action}`, opts);
      toast(resp.message || t(ACTION_TOAST[action] || action), resp.ok ? '' : 'error');
      await loadChambers();
      if (state.currentId === id) await selectChamber(id, { push: false });
    } catch (e) {
      toast(e.message, 'error');
    } finally {
      setLifecyclePending(id, false);
    }
  }

  const PAGE_SIZE = 30;

  function messageKey(m) {
    if (m.id) return m.id;
    return `${m.direction}|${m.timestamp}|${m.from}|${hash32(m.body || '')}`;
  }

  function dayKey(ts) {
    return (ts || '').slice(0, 10); // YYYY-MM-DD
  }

  // System notice = lifecycle/runtime information, rendered as centered gray
  // text instead of a conversation bubble.
  function isSystemMessage(m) {
    return (m.direction === 'inbox' && m.from === 'operator') || m.from === 'cryochamber';
  }

  function buildSystemRow(m) {
    const row = document.createElement('div');
    row.className = 'sys-notice';
    row.dataset.key = messageKey(m);
    row.dataset.day = dayKey(m.timestamp);
    if (m.session != null) row.dataset.session = String(m.session);
    const ts = (m.timestamp || '').slice(11, 16);
    row.textContent = [m.from, ts, m.body || ''].filter(Boolean).join(' · ');
    return row;
  }

  function buildMessageRow(m) {
    if (isSystemMessage(m)) return buildSystemRow(m);
    const row = document.createElement('div');
    // outbox = agent (left), inbox = human (right)
    row.className = 'msg ' + (m.direction === 'outbox' ? 'agent' : 'human');
    if (m.is_question) row.classList.add('question');
    row.dataset.key = messageKey(m);
    row.dataset.day = dayKey(m.timestamp);
    if (m.session != null) row.dataset.session = String(m.session);
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    const from = document.createElement('span');
    from.className = 'from';
    from.textContent = m.direction === 'inbox' ? m.from : (m.from || 'agent');
    const ts = document.createElement('span');
    ts.textContent = (m.timestamp || '').slice(11, 16);
    meta.appendChild(from);
    meta.appendChild(ts);
    const body = document.createElement('div');
    body.className = 'msg-body';
    const rich = renderMessageBody(m.body);
    if (rich !== null) {
      body.classList.add('rich');
      body.innerHTML = rich;
    } else {
      body.textContent = m.body || ''; // CDN libs unavailable — plain text
    }
    row.appendChild(meta);
    row.appendChild(body);
    return row;
  }

  function buildDayMarker(day) {
    const el = document.createElement('div');
    el.className = 'day-marker';
    el.dataset.day = day;
    el.textContent = day;
    return el;
  }

  function buildSessionMarker(session, day) {
    const el = document.createElement('div');
    el.className = 'session-marker';
    el.dataset.day = day;
    el.dataset.session = String(session);
    el.textContent = t('marker.session', { n: session });
    return el;
  }

  // Last visible (session, day) outside the history fold. Skips the
  // <details> child so freshly-appended messages don't re-emit a marker.
  function lastVisibleState(box) {
    for (let i = box.children.length - 1; i >= 0; i--) {
      const child = box.children[i];
      if (child.tagName === 'DETAILS') continue;
      const day = child.dataset?.day;
      if (!day) continue;
      const sessRaw = child.dataset?.session;
      return {
        day,
        session: sessRaw === undefined || sessRaw === '' ? null : Number(sessRaw),
      };
    }
    return { day: null, session: null };
  }

  // Group messages by session when session info is present; fall back to
  // day-only grouping for messages with no `session`. A session change emits
  // a `.session-marker`; within a session, a day change emits a subtle
  // `.day-marker`.
  function appendMessagesInto(target, messages, state) {
    for (const m of messages) {
      const d = dayKey(m.timestamp);
      const sess = m.session == null ? null : Number(m.session);
      if (sess !== state.session) {
        if (sess != null) target.appendChild(buildSessionMarker(sess, d));
        else if (d !== state.day) target.appendChild(buildDayMarker(d));
        state.session = sess;
        state.day = d;
      } else if (d !== state.day) {
        target.appendChild(buildDayMarker(d));
        state.day = d;
      }
      target.appendChild(buildMessageRow(m));
    }
  }

  // Render the entire thread: older messages go inside a collapsible
  // `<details class="thread-history">` fold, latest PAGE_SIZE stay visible
  // below. Matches the TODO / Completed Chambers fold pattern so the
  // dashboard stays consistent.
  function renderThreadContents() {
    const box = view.msgBox;
    box.innerHTML = '';
    view.historyEl = null;
    view.historyCount = 0;
    const messages = view.allMessages;
    const total = messages.length;
    const historyCount = Math.max(0, total - PAGE_SIZE);
    if (historyCount > 0) {
      const details = document.createElement('details');
      details.className = 'thread-history';
      const summary = document.createElement('summary');
      summary.textContent = t('thread.history', { n: historyCount });
      details.appendChild(summary);
      const body = document.createElement('div');
      body.className = 'thread-history-body';
      const state = { session: null, day: null };
      appendMessagesInto(body, messages.slice(0, historyCount), state);
      details.appendChild(body);
      box.appendChild(details);
      view.historyEl = details;
      view.historyCount = historyCount;
    }
    const state = { session: null, day: null };
    appendMessagesInto(box, messages.slice(historyCount), state);
    view.lastMsgKey = total > 0 ? messageKey(messages[total - 1]) : null;
  }

  function buildThread(pane, messages) {
    const box = document.createElement('div');
    box.className = 'thread';
    pane.appendChild(box);
    view.msgBox = box;
    view.allMessages = messages || [];
    renderThreadContents();
    // Scroll to bottom after layout settles (deep-link + font load timing).
    requestAnimationFrame(() => { box.scrollTop = box.scrollHeight; });
  }

  function isAtBottom(el) {
    return (el.scrollHeight - el.scrollTop - el.clientHeight) < 40;
  }

  function updateMessages(messages) {
    if (!view.msgBox) return;
    const box = view.msgBox;
    const wasAtBottom = isAtBottom(box);
    view.allMessages = messages;
    let startAt = 0;
    if (view.lastMsgKey) {
      const idx = messages.findIndex(m => messageKey(m) === view.lastMsgKey);
      if (idx < 0) {
        // Lost our marker — full rerender.
        renderThreadContents();
        box.scrollTop = box.scrollHeight;
        return;
      }
      startAt = idx + 1;
    }
    if (startAt < messages.length) {
      // New messages append outside the fold so the thread keeps growing
      // downward. The fold boundary is frozen at build time — we don't move
      // already-visible messages back into history just because the list
      // grew past PAGE_SIZE.
      const state = lastVisibleState(box);
      appendMessagesInto(box, messages.slice(startAt), state);
      view.lastMsgKey = messageKey(messages[messages.length - 1]);
    }
    if (wasAtBottom) box.scrollTop = box.scrollHeight;
  }

  function buildCompose(pane, id) {
    const wrap = document.createElement('div');
    wrap.className = 'compose';
    wrap.innerHTML = `
      <div class="compose-inner">
        <textarea id="send-body" rows="1" placeholder="${escapeHtml(t('compose.placeholder'))}"></textarea>
        <div class="controls">
          <div class="hint">${escapeHtml(t('compose.hint'))}</div>
          <button class="send">${escapeHtml(t('compose.send'))}</button>
        </div>
      </div>`;
    pane.appendChild(wrap);
    const ta   = wrap.querySelector('#send-body');
    const send = wrap.querySelector('.send');
    // Auto-grow with content so multi-line drafts are visible up to the CSS
    // `max-height` cap (after which the textarea scrolls). Without this, the
    // `rows="1"` control hides all but the last line of a long message.
    const autoGrow = () => {
      ta.style.height = 'auto';
      ta.style.height = ta.scrollHeight + 'px';
    };
    ta.addEventListener('input', autoGrow);
    async function submit() {
      const body = ta.value.trim();
      if (!body) return;
      try {
        await fetchJSON(`/api/chambers/${id}/send`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ body }),
        });
        ta.value = '';
        autoGrow();
      } catch (e) { toast(e.message, 'error'); }
    }
    send.addEventListener('click', submit);
    ta.addEventListener('keydown', e => {
      // Enter inserts a newline (default textarea behaviour). ⌘/Ctrl+Enter
      // submits — this matches the keymap hint rendered on the button.
      if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); submit(); }
    });
  }

  function activateDrawerTab(name) {
    const tabs = document.querySelectorAll('.drawer-tab');
    const panels = document.querySelectorAll('.drawer-body');
    let matched = false;
    tabs.forEach(t => {
      const isMatch = t.getAttribute('data-tab') === name;
      t.classList.toggle('active', isMatch);
      if (isMatch) matched = true;
    });
    if (!matched) return;
    panels.forEach(p => {
      p.classList.toggle('hidden', p.getAttribute('data-panel') !== name);
    });
    if (name === 'log' && view && view.logEl) {
      view.logEl.scrollTop = view.logEl.scrollHeight;
    }
  }

  function initDrawerTabs() {
    document.querySelectorAll('.drawer-tab').forEach(tab => {
      tab.addEventListener('click', () => activateDrawerTab(tab.getAttribute('data-tab')));
    });
    // ?drawer=todos|sync|settings|log opens that drawer panel on load.
    // Useful for direct links and scripted screenshots.
    const initial = new URLSearchParams(window.location.search).get('drawer');

  }

  const TODO_PENDING_CAP = 20;

  function todoSignature(todos) {
    if (!todos || !todos.length) return '0:';
    return todos.length + ':' + todos.map(t => `${t.id}|${t.done ? 1 : 0}|${t.at || ''}`).join(',');
  }

  function buildTodoRow(t) {
    const row = document.createElement('div');
    row.className = 'todo' + (t.done ? ' done' : '');
    const check = document.createElement('span');
    check.className = 'check';
    const text = document.createElement('span');
    text.className = 'text';
    text.textContent = t.text;
    row.appendChild(check);
    row.appendChild(text);
    if (t.at) {
      const when = document.createElement('span');
      when.className = 'when';
      applyWake(when, t.at);
      row.appendChild(when);
    }
    return row;
  }

  function renderTodos(todos) {
    const sig = todoSignature(todos);
    if (sig === view.lastTodoSig) return;
    view.lastTodoSig = sig;
    const all = todos || [];
    // Partition + sort: pending by `at` ascending (undated last), done by id
    // descending (most recently added first).
    const pending = all.filter(t => !t.done).slice().sort((a, b) => {
      if (a.at && b.at) return a.at < b.at ? -1 : a.at > b.at ? 1 : 0;
      if (a.at) return -1;
      if (b.at) return 1;
      return a.id - b.id;
    });
    const done = all.filter(t => t.done).slice().sort((a, b) => b.id - a.id);

    const box = document.getElementById('panel-todos');
    box.innerHTML = '';
    const title = document.createElement('div');
    title.className = 'section-title';
    title.innerHTML =
      `${escapeHtml(t('todos.title'))} <span class="count">${escapeHtml(t('todos.count', { pending: pending.length, done: done.length }))}</span>`;
    box.appendChild(title);

    const list = document.createElement('div');
    list.className = 'todos';
    const visible = pending.slice(0, TODO_PENDING_CAP);
    for (const td of visible) list.appendChild(buildTodoRow(td));
    if (pending.length > TODO_PENDING_CAP) {
      const more = document.createElement('div');
      more.className = 'todo-more';
      more.textContent = t('todos.more', { n: pending.length - TODO_PENDING_CAP });
      list.appendChild(more);
    }
    box.appendChild(list);

    if (done.length) {
      const details = document.createElement('details');
      details.className = 'todo-history';
      const summary = document.createElement('summary');
      summary.textContent = t('todos.history', { n: done.length });
      details.appendChild(summary);
      const histList = document.createElement('div');
      histList.className = 'todos';
      for (const td of done) histList.appendChild(buildTodoRow(td));
      details.appendChild(histList);
      box.appendChild(details);
    }

    document.getElementById('todos-count').textContent = pending.length;
  }

  function syncSignature(sync) {
    if (!sync || !sync.length) return '0:';
    return sync.length + ':' + sync.map(s =>
      `${s.backend}|${s.running}|${s.installed}|${s.target}|${s.last_pushed_session ?? ''}`
    ).join(',');
  }

  async function syncToggle(id, backend, running) {
    if (running) {
      if (!window.confirm(t('confirm.stop_sync', { backend }))) return false;
    }
    try {
      const resp = await fetchJSON(
        `/api/chambers/${id}/sync/${backend}/${running ? 'stop' : 'start'}`,
        { method: 'POST' }
      );
      toast(resp.message || t(running ? 'toast.stopped' : 'toast.started'), resp.ok ? '' : 'error');
      return true;
    } catch (e) {
      toast(e.message, 'error');
      return false;
    }
  }

  function renderSync(id, sync) {
    const sig = syncSignature(sync);
    if (sig === view.lastSyncSig) return;
    view.lastSyncSig = sig;
    const box = view.syncEl;
    if (!box) return;
    box.innerHTML = '';
    const items = sync || [];
    const title = document.createElement('div');
    title.className = 'section-title';
    const running = items.filter(s => s.running).length;
    title.innerHTML = `${escapeHtml(t('sync.title'))} <span class="count">${running}/${items.length}</span>`;
    box.appendChild(title);
    if (!items.length) {
      const empty = document.createElement('div');
      empty.className = 'sync-help';
      empty.textContent = t('sync.empty');
      box.appendChild(empty);
      return;
    }
    const list = document.createElement('div');
    list.className = 'sync-list';

    for (const s of items) {
      const card = document.createElement('div');
      card.className = 'sync-card';
      const footText = s.last_pushed_session != null
        ? t('sync.last_push', { n: s.last_pushed_session })

      card.innerHTML = `
        <div class="sync-card-head">
          <div class="sync-card-name">

        <div class="sync-foot">
          <span>${escapeHtml(footText)}</span>
        </div>`;
      const cb = card.querySelector('input[type=checkbox]');
      cb.addEventListener('change', async () => {
        // Keep the user's click visible while the request is in flight — the
        // SSE `status` event re-renders from truth when the backend catches up.
        // Revert only if the request fails or the confirm is cancelled.
        const prev = s.running;
        const ok = await syncToggle(id, s.backend, prev);
        if (!ok) cb.checked = prev;

  // Center-pane tab strip: Messages / Plan / Notes. Tab bodies are siblings
  // hidden via `.hidden`; we never tear down a body when switching tabs so
  // each panel's scrollTop and textarea drafts survive tab changes.
  function centerTabStorageKey(chamberId) { return `hub:tab:${chamberId}`; }

  function buildCenterTabs(pane, chamberId, entry) {
    const bar = document.createElement('div');
    bar.className = 'center-tabs';

    const messagesTab = document.createElement('div');
    messagesTab.className = 'center-tab';
    messagesTab.dataset.tab = 'messages';
    messagesTab.textContent = t('ctab.messages');
    const unread = document.createElement('span');
    unread.className = 'tab-count';
    unread.hidden = true;
    messagesTab.appendChild(unread);
    view.messagesUnreadEl = unread;

    const planTab = document.createElement('div');
    planTab.className = 'center-tab';
    planTab.dataset.tab = 'plan';
    planTab.textContent = t('ctab.plan');

    const notesTab = document.createElement('div');
    notesTab.className = 'center-tab';
    notesTab.dataset.tab = 'notes';
    notesTab.textContent = t('ctab.notes');

    bar.appendChild(messagesTab);
    bar.appendChild(planTab);
    bar.appendChild(notesTab);
    pane.appendChild(bar);

    const messagesBody = document.createElement('div');
    messagesBody.className = 'center-tab-body messages-body';
    messagesBody.dataset.panel = 'messages';
    pane.appendChild(messagesBody);

    const planBody = document.createElement('div');
    planBody.className = 'center-tab-body file-body-panel hidden';
    planBody.dataset.panel = 'plan';
    pane.appendChild(planBody);

    const notesBody = document.createElement('div');
    notesBody.className = 'center-tab-body file-body-panel hidden';
    notesBody.dataset.panel = 'notes';
    pane.appendChild(notesBody);

    view.messagesBodyEl = messagesBody;
    view.planBodyEl = planBody;
    view.notesBodyEl = notesBody;

    const tabs = [messagesTab, planTab, notesTab];
    const bodies = [messagesBody, planBody, notesBody];
    function activate(name) {
      tabs.forEach(t => t.classList.toggle('active', t.dataset.tab === name));
      bodies.forEach(b => b.classList.toggle('hidden', b.dataset.panel !== name));
      try { localStorage.setItem(centerTabStorageKey(chamberId), name); } catch (e) {}
    }
    tabs.forEach(t => t.addEventListener('click', () => activate(t.dataset.tab)));

    let initial = 'messages';
    // ?tab=plan|notes wins for shareable / scriptable links; falls back to
    // the per-chamber localStorage value, then to messages.
    const queryTab = new URLSearchParams(window.location.search).get('tab');
    if (queryTab && tabs.some(t => t.dataset.tab === queryTab)) {
      initial = queryTab;
    } else {
      try {
        const saved = localStorage.getItem(centerTabStorageKey(chamberId));
        if (saved && tabs.some(t => t.dataset.tab === saved)) initial = saved;
      } catch (e) {}
    }
    activate(initial);

    updateMessagesUnreadBadge(entry);
  }

  function updateMessagesUnreadBadge(entry) {
    if (!view || !view.messagesUnreadEl) return;

    const article = document.createElement('article');

  function renderNotes(status) {
    if (!view || !view.notesEl) return;
    setRenderedMarkdown(
      view.notesEl,
      status.notes_html || '',
      'notesLastHtml',
      t('notes.empty'),

  function renderPlan(status) {
    if (!view || !view.planEl) return;
    setRenderedMarkdown(
      view.planEl,
      status.plan_html || '',
      'planLastHtml',
      t('plan.empty')
    );
  }

  // Shared renderer for tab bodies whose content is server-rendered HTML
  // (currently Plan and Notes). Uses innerHTML directly because the source
  // markdown was rendered through `render_markdown_safe`, which already
  // escapes raw HTML and drops image tags.
  //
  // `opts.stickToBottom` makes the renderer "follow the tail": on first
  // render and on any update where the operator was already scrolled to the
  // bottom, the scroller jumps to the new bottom. Otherwise scrollTop is
  // preserved so the operator's reading position survives SSE refreshes.
  // The empty-on-init case naturally counts as "at bottom" so the first
  // non-empty render lands at the bottom.
  function setRenderedMarkdown(el, html, lastKey, emptyLabel, opts) {
    const stickToBottom = !!(opts && opts.stickToBottom);
    if (html === '') {
      if (!el.classList.contains('empty') || view[lastKey] !== '') {
        el.classList.add('empty');
        el.textContent = emptyLabel;
        view[lastKey] = '';
      }
      return;
    }
    if (view[lastKey] === html && !el.classList.contains('empty')) return;
    const scroller = el.parentNode;
    let prev = 0;
    let wasAtBottom = false;
    if (scroller) {
      prev = scroller.scrollTop;
      wasAtBottom = (scroller.scrollHeight - scroller.scrollTop - scroller.clientHeight) < 30;
    }
    el.classList.remove('empty');
    el.innerHTML = html;
    view[lastKey] = html;
    if (scroller) {
      if (stickToBottom && wasAtBottom) {
        scroller.scrollTop = scroller.scrollHeight;
      } else {
        scroller.scrollTop = prev;
      }
    }
  }

  function settingsSignature(rows, hasConfig) {
    if (!rows || rows.length === 0) return hasConfig ? 'unparsed' : 'empty';
    return 'rows:' + rows.map(r => `${r.kind}|${r.key}|${r.value}`).join('\n');
  }

  function renderSettings(status) {
    const box = document.getElementById('panel-settings');
    if (!box) return;
    const rows = Array.isArray(status.settings_rows) ? status.settings_rows : [];
    // The raw cryo.toml is no longer sent to the browser (it can hold an API
    // key); `has_config` distinguishes an absent file from an unparseable one.
    const hasConfig = !!status.has_config;
    const sig = settingsSignature(rows, hasConfig);
    if (sig === view.settingsLastSig) return;
    view.settingsLastSig = sig;

    box.innerHTML = '';
    const title = document.createElement('div');
    title.className = 'section-title';
    title.textContent = 'cryo.toml';
    box.appendChild(title);

    if (!hasConfig) {
      const empty = document.createElement('div');
      empty.className = 'settings-empty';
      empty.textContent = t('settings.empty');
      box.appendChild(empty);
      view.settingsEl = empty;
      return;
    }

    if (rows.length === 0) {
      // Present but unparseable. Never echo the raw file — it may hold an API
      // key. Point the operator at the file on disk instead.
      const note = document.createElement('div');
      note.className = 'settings-empty';
      note.textContent = t('settings.unparseable');
      box.appendChild(note);
      view.settingsEl = note;
      return;
    }

    const list = document.createElement('div');
    list.className = 'settings-list';
    for (const row of rows) {
      const item = document.createElement('div');
      item.className = 'settings-row' + (row.kind === 'section' ? ' section' : '');
      const key = document.createElement('span');
      key.className = 'k';
      key.textContent = row.key;
      const val = document.createElement('span');
      val.className = 'v';
      val.textContent = row.value;
      item.appendChild(key);
      item.appendChild(val);
      list.appendChild(item);
    }
    box.appendChild(list);
    view.settingsEl = list;
  }

  function appendLogLine(line) {
    if (!view || !view.logEl) return;
    const el = view.logEl;
    const atBottom = (el.scrollHeight - el.scrollTop - el.clientHeight) < 30;
    el.textContent += (el.textContent ? '\n' : '') + line;
    if (atBottom) el.scrollTop = el.scrollHeight;
  }

  async function buildDetail(id, seq) {
    const entry = state.chambers.find(c => c.id === id);
    if (!entry) return;
    const pane = document.getElementById('pane');
    const [status, messages, todos, sync] = await Promise.all([
      fetchJSON(`/api/chambers/${id}/status`),
      fetchJSON(`/api/chambers/${id}/messages`),
      fetchJSON(`/api/chambers/${id}/todos`),
      fetchJSON(`/api/chambers/${id}/sync`),
    ]);
    if (seq !== state.detailSeq || state.currentId !== id) return;
    pane.innerHTML = '';
    view = newView();
    view.chamberId = id;
    buildHead(pane, entry, status);
    buildCenterTabs(pane, id, entry);
    buildThread(view.messagesBodyEl, messages);
    buildCompose(view.messagesBodyEl, id);
    buildPlanBody(view.planBodyEl);
    buildNotesBody(view.notesBodyEl);
    view.syncEl = document.getElementById('panel-sync');
    renderTodos(todos);
    renderSync(id, sync);
    renderLog(status);
    renderNotes(status);
    renderPlan(status);
    renderSettings(status);
    document.getElementById('drawer').hidden = false;
  }

  async function updateDetail(id, parts) {
    if (!view || view.chamberId !== id) return;
    const fetches = {};
    if (parts.status)   fetches.status   = fetchJSON(`/api/chambers/${id}/status`);
    if (parts.messages) fetches.messages = fetchJSON(`/api/chambers/${id}/messages`);
    if (parts.todos)    fetches.todos    = fetchJSON(`/api/chambers/${id}/todos`);
    if (parts.sync)     fetches.sync     = fetchJSON(`/api/chambers/${id}/sync`);
    const entries = await Promise.allSettled(
      Object.entries(fetches).map(async ([k, p]) => [k, await p])
    );
    const data = {};
    for (const r of entries) {
      if (r.status === 'fulfilled') data[r.value[0]] = r.value[1];
    }
    const entry = state.chambers.find(c => c.id === id);
    if (entry && data.status) {
      updateHead(entry, data.status);
      updateLifecycleButtons(entry);
      renderLog(data.status); // refreshes log_tail baseline
      renderNotes(data.status);
      renderPlan(data.status);
      renderSettings(data.status);
      updateMessagesUnreadBadge(entry);
    }
    if (data.sync)     renderSync(id, data.sync);
    if (data.todos)    renderTodos(data.todos);
    if (data.messages) updateMessages(data.messages);
  }

  async function selectChamber(id, options = {}) {

      `<div class="pane-empty"><div>${escapeHtml(t('pane.empty'))}</div></div>`;

  async function syncRouteSelection() {
    const urlId = urlChamberId();

  document.getElementById('refresh').addEventListener('click', async () => {
    await refreshChamberIndex();
  });

  initDrawerTabs();

  // Not EventSource: it cannot send an Authorization header, and in --public
  // mode /api/events is 401 without one. A fetch-streamed reader carries the
  // bearer token and reconnects with backoff; in open mode it behaves the
  // same with no token attached.
  const sseHandlers = {
    message: async d => {
      if (state.currentId === d.chamber_id) {
        await updateDetail(state.currentId, { messages: true });
      }
      await loadChambers();
    },
    status: async d => {
      await loadChambers();
      if (state.currentId === d.chamber_id) {
        await updateDetail(state.currentId, { status: true, todos: true, sync: true });
      }
    },
    log: async d => {
      if (state.currentId === d.chamber_id) appendLogLine(d.line);
      scheduleRailRefresh(d.chamber_id);
    },
    index: async () => { await loadChambers(); },
  };
  (async function connectEvents() {
    let backoff = 1000;
    for (;;) {
      try {
        const res = await fetch('/api/events', {
          headers: authHeaders({ Accept: 'text/event-stream' }),
        });
        if (res.status === 401) {
          // Absent, wrong, or just-revoked credential. No point reconnecting
          // with it; the post-token reload starts a fresh stream.
          dropToken();
          showTokenGate();
          return;
        }
        if (!res.ok || !res.body) throw new Error(`events: ${res.status}`);
        backoff = 1000;
        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buf = '';
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          buf += decoder.decode(value, { stream: true });
          let sep;
          while ((sep = buf.indexOf('\n\n')) !== -1) {
            const frame = buf.slice(0, sep);
            buf = buf.slice(sep + 2);
            let event = 'message';
            let data = '';
            for (const line of frame.split('\n')) {
              if (line.startsWith('event:')) event = line.slice(6).trim();
              else if (line.startsWith('data:')) data += (data ? '\n' : '') + line.slice(5).trim();
            }
            const handler = sseHandlers[event];
            if (!handler || !data) continue; // keep-alive comments and unknown events
            try {
              await handler(event === 'index' ? null : JSON.parse(data));
            } catch (e) { /* one bad frame must not kill the stream */ }
          }
        }
      } catch (e) { /* network drop or server restart: retry below */ }
      await new Promise(r => setTimeout(r, backoff));
      backoff = Math.min(backoff * 2, 30_000);
    }
  })();

  // Server returns absolute datetimes; tick once a wall-clock minute (with a
  // little extra so we don't drift past the boundary) to repaint relative
  // labels in place. SSE-driven re-renders also call `applyWake`, so the
  // ticker only matters when nothing is changing on the daemon.
  setInterval(refreshWakeRelatives, 30_000);
  setInterval(() => { refreshChamberIndex({ silent: true }); }, 15_000);

  const MODELS_DEV_API_URL = 'https://models.dev/api.json';

  (function () {
    const btnOpen = document.getElementById('chamber-new');
    const backdrop = document.getElementById('modal-backdrop');
    const input = document.getElementById('modal-name-input');
    const providerDetails = document.getElementById('modal-provider-details');
    const providerInput = document.getElementById('modal-provider-input');
    const providerOptions = document.getElementById('modal-provider-options');
    const modelInput = document.getElementById('modal-model-input');
    const modelOptions = document.getElementById('modal-model-options');
    const modelStatus = document.getElementById('modal-model-status');
    const apiKey = document.getElementById('modal-api-key-input');
    const errBox = document.getElementById('modal-error');
    const btnCancel = document.getElementById('modal-cancel');
    const btnCreate = document.getElementById('modal-create');
    let modelCatalog = [];
    let modelCatalogLoaded = false;
    let modelCatalogLoading = false;

    function normalizeCatalogProvider(raw) {
      const id = String(raw && raw.id || '').trim().toLowerCase();
      if (!id) return null;
      const models = Array.isArray(raw.models) ? raw.models
        .map(m => ({
          id: String(m && m.id || '').trim(),
          name: String(m && m.name || m && m.id || '').trim(),
        }))
        .filter(m => m.id) : [];
      return {
        id,
        name: String(raw.name || id).trim(),
        models,
      };
    }

    function providersFromModelsDev(data) {
      const entries = Array.isArray(data)
        ? data.map(p => [p && (p.id || p.provider), p])
        : Object.entries(data || {});
      return entries.map(([id, providerData]) => {
        const modelsValue = providerData && providerData.models;
        const modelEntries = Array.isArray(modelsValue)
          ? modelsValue.map(m => [m && (m.id || m.model), m])
          : Object.entries(modelsValue || {});
        return normalizeCatalogProvider({
          id,
          name: providerData && providerData.name,
          models: modelEntries.map(([modelId, modelData]) => ({
            id: modelId,
            name: modelData && modelData.name,
          })),
        });
      }).filter(Boolean);
    }

    function mergeCatalog(base, incoming) {
      const providers = new Map();
      const addProvider = item => {
        const p = normalizeCatalogProvider(item);
        if (!p) return;
        const existing = providers.get(p.id);
        if (!existing) {
          providers.set(p.id, { ...p, models: [...p.models] });
          return;
        }
        existing.name = existing.name || p.name;
        const modelIds = new Set(existing.models.map(m => m.id));
        for (const m of p.models) {
          if (!modelIds.has(m.id)) {
            existing.models.push(m);
            modelIds.add(m.id);
          }
        }
      };
      base.forEach(addProvider);
      incoming.forEach(addProvider);
      const preferred = new Map(base.map((p, i) => [p.id, i]));
      return Array.from(providers.values()).sort((a, b) => {
        const ai = preferred.has(a.id) ? preferred.get(a.id) : 999;
        const bi = preferred.has(b.id) ? preferred.get(b.id) : 999;
        if (ai !== bi) return ai - bi;
        return a.name.localeCompare(b.name);
      });
    }

    function renderProviderOptions() {
      providerOptions.innerHTML = '';
      for (const p of modelCatalog) {
        const option = document.createElement('option');
        option.value = p.id;
        option.label = p.name;
        providerOptions.appendChild(option);
      }
    }

    function selectedProviderId() {
      return providerInput.value.trim();
    }

    function renderModelOptions() {
      const providerId = selectedProviderId().toLowerCase();
      const found = modelCatalog.find(p => p.id === providerId);
      modelOptions.innerHTML = '';
      for (const m of (found && found.models || [])) {
        const option = document.createElement('option');
        option.value = m.id;
        if (m.name && m.name !== m.id) option.label = m.name;
        modelOptions.appendChild(option);
      }
    }

    async function loadModelsDevCatalog() {
      if (modelCatalogLoaded || modelCatalogLoading) return;
      modelCatalogLoading = true;
      modelStatus.textContent = t('modal.models_loading');
      try {
        const res = await fetch(MODELS_DEV_API_URL, { cache: 'force-cache' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        modelCatalog = mergeCatalog([], providersFromModelsDev(data));
        modelCatalogLoaded = true;
        modelStatus.textContent = '';
        renderProviderOptions();
        renderModelOptions();
      } catch (e) {
        modelStatus.textContent = t('modal.models_unavailable');
      } finally {
        modelCatalogLoading = false;
      }
    }

    function showModal() {
      errBox.hidden = true;
      errBox.textContent = '';
      input.value = '';
      providerDetails.open = false;
      providerInput.value = '';
      modelInput.value = '';
      apiKey.value = '';
      modelStatus.textContent = '';
      renderProviderOptions();
      renderModelOptions();
      backdrop.hidden = false;
      setTimeout(() => input.focus(), 0);
    }

    function hideModal() {
      backdrop.hidden = true;
    }

    function showErr(msg) {
      errBox.textContent = msg;
      errBox.hidden = false;
    }

    btnOpen.addEventListener('click', showModal);
    btnCancel.addEventListener('click', hideModal);
    backdrop.addEventListener('click', e => {
      if (e.target === backdrop) hideModal();
    });
    document.addEventListener('keydown', e => {
      if (!backdrop.hidden && e.key === 'Escape') hideModal();
    });
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') btnCreate.click();
    });
    providerDetails.addEventListener('toggle', () => {
      if (providerDetails.open) loadModelsDevCatalog();
    });
    providerInput.addEventListener('input', renderModelOptions);
    providerInput.addEventListener('change', renderModelOptions);
    providerInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') btnCreate.click();
    });
    modelInput.addEventListener('keydown', e => {
      if (e.key === 'Enter') btnCreate.click();
    });
    apiKey.addEventListener('keydown', e => {
      if (e.key === 'Enter') btnCreate.click();
    });

    btnCreate.addEventListener('click', async () => {
      const name = input.value.trim();
      const key = apiKey.value.trim();
      const providerId = selectedProviderId();
      const selectedModel = modelInput.value.trim();
      const configureProvider = providerDetails.open
        || providerInput.value.trim()
        || key
        || selectedModel;
      if (!name) {
        showErr(t('modal.err.name_empty'));
        return;
      }
      if (configureProvider && !providerId) {
        showErr(t('modal.err.provider_empty'));
        return;
      }
      if (configureProvider && !key) {
        showErr(t('modal.err.key_empty'));
        return;
      }

      const payload = { name };
      if (configureProvider) {
        payload.api_key_provider = providerId;
        payload.api_key = key;
        if (selectedModel) payload.model = selectedModel;
      }

      btnCreate.disabled = true;
      try {
        // Not fetchJSON: creation branches on 201-vs-error bodies. The auth
        // header still has to ride along, or this is the one panel action
        // that 401s in public mode.
        const r = await fetch('/api/chambers/new', {
          method: 'POST',
          headers: authHeaders({ 'Content-Type': 'application/json', 'X-Cryo-CSRF': '1' }),
          body: JSON.stringify(payload),
        });
        if (r.status === 401) {
          dropToken();
          showTokenGate();
          return;
        }
        const body = await r.json().catch(() => ({}));
        if (r.status === 201) {
          hideModal();
          await loadChambers();
          if (body.id) {
            await selectChamber(body.id);
          }
        } else {
          showErr((body && body.error) || t('modal.err.http', { n: r.status }));
        }
      } catch (e) {
        showErr(t('modal.err.generic', { msg: e }));
      } finally {
        btnCreate.disabled = false;
      }
    });
  })();

  // Expose for subsequent task wiring.
  window.__hub = { state, fetchJSON, toast, escapeHtml, hash32, renderRail, loadChambers, selectChamber };

  (async () => {
    await loadChambers();
    await syncRouteSelection();
  })();
})();
</script>
</body>
</html>
