# cryo.toml — Cryochamber project configuration

# Agent command (e.g. "opencode", "claude", "codex")
agent = "{{agent}}"

# Failed attempts before sending a retry alert (daemon keeps retrying).
# Use 1 for short one-shot tasks that should fail fast; bump to 5+ for
# long-running assistants that should survive flaky networks or API blips.
max_retries = 1

# Session timeout in seconds (0 = no timeout)
max_session_duration = 0

# Watch inbox for reactive wake
watch_inbox = true

# Fallback alert method when dead-man switch fires:
#   "outbox" = write alert to messages/outbox/ (default; delivered by any sync channel)
#   "none"   = disable fallback alerts entirely
# fallback_alert = "outbox"

# Periodic status report (written to messages/outbox/ for sync delivery):
#   report_time = "09:00" (HH:MM local time)
#   report_interval = 24 (hours between reports; 0 = disabled)
# report_time = "09:00"
# report_interval = 24

# Sync polling interval in seconds (for cryo-zulip sync / cryo-gh sync)
# zulip_poll_interval = 5
# gh_poll_interval = 5

# Provider rotation: switch API keys on failure
# WARNING: If you add API keys below, ensure cryo.toml is in your .gitignore
# to avoid accidentally committing secrets.
#   rotate_on: "quick-exit" (rotate on fast exit), "any-failure", "never" (default)
# rotate_on = "never"
#
# Provider pool (ordered list of API key configurations):
# [[providers]]
# name = "anthropic"
# env = { ANTHROPIC_API_KEY = "sk-ant-..." }
#
# [[providers]]
# name = "openai"
# env = { OPENAI_API_KEY = "sk-...", OPENAI_BASE_URL = "https://api.openai.com/v1" }
#
# [[providers]]
# name = "opencode"
# env = { OPENCODE_PROVIDER = "anthropic", OPENCODE_MODEL = "claude-sonnet-4-20250514", ANTHROPIC_API_KEY = "sk-ant-..." }
