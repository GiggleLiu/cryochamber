# cryo.toml — Personal Assistant

# Agent command
agent = "opencode"


# Session timeout in seconds (0 = no timeout)
max_session_duration = 3600

# Directories to watch for reactive wake (two-way interaction via Zulip)
watch_dirs = ["messages/inbox"]

# Default `cryo-agent receive --wait` timeout: stay interactive for up to
# 1 hour of user silence before hibernating
wait_timeout = 3600

# Zulip sync polling interval (seconds)
zulip_poll_interval = 30

# Provider env injected into the agent process. To enable, uncomment and fill in:
# [provider]
# name = "opencode"
# env = { ANTHROPIC_API_KEY = "sk-ant-..." }
