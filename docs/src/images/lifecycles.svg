<svg xmlns="http://www.w3.org/2000/svg" viewBox="-30 -60 1180 920" font-family="-apple-system, system-ui, 'Segoe UI', sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0.8" dy="1.6" stdDeviation="1.4" flood-opacity="0.2"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a5568"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#aa3333"/>
    </marker>
    <style><![CDATA[
      /* Node colors stay constant — every fill is a light pastel that reads
         well against either a white or a dark page background. The text
         classes below carry a white halo so dark glyphs stay legible when
         they cross over arrows or sit on the page background; in dark mode
         the prefers-color-scheme override switches glyph fill to a light
         color so the halo doubles as a soft outline. */

      .node    { stroke-width: 1.3; }
      .entry   { fill: #f3f3f3; stroke: #a0a0a0; }
      .idle    { fill: #eef5ff; stroke: #6b9bd8; }
      .active  { fill: #fff5e6; stroke: #d8a15b; }
      .done    { fill: #eaf7ea; stroke: #6bb06b; }
      .crash   { fill: #fde8e8; stroke: #aa3333; }

      .title   { font-size: 13px; font-weight: 600; fill: #1e2838; text-anchor: middle;
                 paint-order: stroke; stroke: white; stroke-width: 3.5;
                 stroke-linejoin: round; }
      .desc    { font-size: 10px; fill: #4a5568; text-anchor: middle;
                 paint-order: stroke; stroke: white; stroke-width: 3;
                 stroke-linejoin: round; }
      .edge     { stroke: #4a5568; stroke-width: 1.3; fill: none; }
      .edge-red { stroke: #aa3333; stroke-width: 1.3; fill: none; stroke-dasharray: 5 3.5; }
      .elabel     { font-size: 10px; fill: #1e2838; text-anchor: middle;
                    paint-order: stroke; stroke: white; stroke-width: 3.5;
                    stroke-linejoin: round; font-weight: 500; }
      .elabel-red { font-size: 10px; fill: #aa3333; text-anchor: middle;
                    paint-order: stroke; stroke: white; stroke-width: 3.5;
                    stroke-linejoin: round; font-weight: 500; }
      .big-title { font-size: 17px; font-weight: 700; fill: #1e2838; text-anchor: middle;
                   paint-order: stroke; stroke: white; stroke-width: 5;
                   stroke-linejoin: round; }
      .legend    { font-size: 10px; fill: #4a5568; text-anchor: start;
                   paint-order: stroke; stroke: white; stroke-width: 3;
                   stroke-linejoin: round; }
      .divider   { stroke: #d6dae3; stroke-width: 1; stroke-dasharray: 4 4; }

      /* Dark-mode override (browsers honor this; static rasterizers ignore). */
      @media (prefers-color-scheme: dark) {
        .big-title, .title, .elabel { fill: #f5f7fb; stroke: #1e2230; }
        .desc, .legend             { fill: #c8cdd6; stroke: #1e2230; }
        .elabel-red                { fill: #ff8a8a; stroke: #1e2230; }
        .edge                      { stroke: #c8cdd6; }
        .divider                   { stroke: #555a66; }
      }
    ]]></style>
  </defs>

  <!-- ============================ -->
  <!-- 1. MESSAGE LIFECYCLE         -->
  <!-- ============================ -->

  <text x="560" y="-30" class="big-title">How a Message Travels Through the Chamber</text>

  <!-- Arrived (entry pill) -->
  <g transform="translate(110,130)">
    <rect class="node entry" x="-80" y="-32" width="160" height="64" rx="32" filter="url(#shadow)"/>
    <text class="title" y="-6">Arrived</text>
    <text class="desc" y="10">a file landed in the</text>
    <text class="desc" y="23">chamber's mailbox</text>
  </g>

  <!-- Waiting -->
  <g transform="translate(360,130)">
    <rect class="node idle" x="-85" y="-35" width="170" height="70" rx="10" filter="url(#shadow)"/>
    <text class="title" y="-10">Waiting to be Read</text>
    <text class="desc" y="6">sitting in the inbox —</text>
    <text class="desc" y="19">daemon schedules a wake</text>
  </g>

  <!-- Received (archived in the same step) -->
  <g transform="translate(620,130)">
    <rect class="node active" x="-95" y="-40" width="190" height="80" rx="10" filter="url(#shadow)"/>
    <text class="title" y="-15">Received</text>
    <text class="desc" y="1">agent called receive —</text>
    <text class="desc" y="14">file archived right away;</text>
    <text class="desc" y="27">a reply is still owed</text>
  </g>

  <!-- Answered by Agent (top branch, pill) -->
  <g transform="translate(960,40)">
    <rect class="node done" x="-90" y="-32" width="180" height="64" rx="32" filter="url(#shadow)"/>
    <text class="title" y="-6">Answered by Agent</text>
    <text class="desc" y="10">agent sent a message —</text>
    <text class="desc" y="23">counts as the reply</text>
  </g>

  <!-- Answered by Chamber (bottom branch, pill) -->
  <g transform="translate(960,220)">
    <rect class="node done" x="-90" y="-32" width="180" height="64" rx="32" filter="url(#shadow)"/>
    <text class="title" y="-6">Answered by Chamber</text>
    <text class="desc" y="10">session ended with no reply;</text>
    <text class="desc" y="23">chamber writes a fallback</text>
  </g>

  <!-- Edges -->
  <path class="edge" d="M 190,130 L 273,130" marker-end="url(#arrow)"/>
  <text class="elabel" x="232" y="120">mailbox write</text>

  <path class="edge" d="M 445,130 L 523,130" marker-end="url(#arrow)"/>
  <text class="elabel" x="484" y="116">agent reads</text>
  <text class="elabel" x="484" y="144">(file → archive)</text>

  <!-- Received -> Answered by Agent : up-right diagonal -->
  <path class="edge" d="M 718,98 L 868,52" marker-end="url(#arrow)"/>
  <text class="elabel" x="800" y="65">agent sends a message</text>

  <!-- Received -> Answered by Chamber : down-right diagonal -->
  <path class="edge" d="M 718,162 L 868,208" marker-end="url(#arrow)"/>
  <text class="elabel" x="800" y="200">session ends without a send</text>

  <!-- divider between the two lifecycles -->
  <line x1="20" y1="320" x2="1140" y2="320" class="divider"/>

  <!-- ============================ -->
  <!-- 2. TODO / REMINDER LIFECYCLE -->
  <!-- ============================ -->

  <text x="560" y="370" class="big-title">How a Reminder (TODO) Gets Consumed</text>

  <!-- Removed (above Waiting) -->
  <g transform="translate(310,440)">
    <rect class="node done" x="-75" y="-26" width="150" height="52" rx="26" filter="url(#shadow)"/>
    <text class="title" y="-3">Removed</text>
    <text class="desc" y="14">deleted by operator</text>
  </g>

  <!-- Marked Done (above Due) -->
  <g transform="translate(520,440)">
    <rect class="node done" x="-75" y="-26" width="150" height="52" rx="26" filter="url(#shadow)"/>
    <text class="title" y="-3">Marked Done</text>
    <text class="desc" y="14">checked off early</text>
  </g>

  <!-- Created -->
  <g transform="translate(110,560)">
    <rect class="node entry" x="-75" y="-32" width="150" height="64" rx="32" filter="url(#shadow)"/>
    <text class="title" y="-6">Created</text>
    <text class="desc" y="10">agent scheduled a</text>
    <text class="desc" y="23">follow-up with a time</text>
  </g>

  <!-- Waiting -->
  <g transform="translate(310,560)">
    <rect class="node idle" x="-70" y="-35" width="140" height="70" rx="10" filter="url(#shadow)"/>
    <text class="title" y="-10">Waiting</text>
    <text class="desc" y="6">pending in the list,</text>
    <text class="desc" y="19">waits for its time</text>
  </g>

  <!-- Due -->
  <g transform="translate(520,560)">
    <rect class="node idle" x="-70" y="-35" width="140" height="70" rx="10" filter="url(#shadow)"/>
    <text class="title" y="-10">Due</text>
    <text class="desc" y="6">time has arrived,</text>
    <text class="desc" y="19">ready to trigger</text>
  </g>

  <!-- Consumed -->
  <g transform="translate(720,560)">
    <rect class="node active" x="-80" y="-38" width="160" height="76" rx="10" filter="url(#shadow)"/>
    <text class="title" y="-13">Consumed</text>
    <text class="desc" y="3">daemon picked it up;</text>
    <text class="desc" y="16">marked done and</text>
    <text class="desc" y="29">a session starts</text>
  </g>

  <!-- Cleanly Finished (pill, far right top) -->
  <g transform="translate(990,470)">
    <rect class="node done" x="-95" y="-32" width="190" height="64" rx="32" filter="url(#shadow)"/>
    <text class="title" y="-6">Cleanly Finished</text>
    <text class="desc" y="10">session hibernated politely,</text>
    <text class="desc" y="23">reminder stays done</text>
  </g>

  <!-- Retried Later (far right bottom) -->
  <g transform="translate(990,650)">
    <rect class="node crash" x="-100" y="-40" width="200" height="80" rx="10" filter="url(#shadow)"/>
    <text class="title" y="-16">Retried Later</text>
    <text class="desc" y="-1">session crashed → fresh</text>
    <text class="desc" y="12">reminder "(attempt k)" with</text>
    <text class="desc" y="25">delay 2ᵏ min (cap 1 day)</text>
  </g>

  <!-- Forward edges along main row -->
  <path class="edge" d="M 185,560 L 238,560" marker-end="url(#arrow)"/>
  <text class="elabel" x="212" y="551">added</text>

  <path class="edge" d="M 380,560 L 448,560" marker-end="url(#arrow)"/>
  <text class="elabel" x="414" y="551">time passes</text>

  <path class="edge" d="M 590,560 L 638,560" marker-end="url(#arrow)"/>
  <text class="elabel" x="614" y="551">trigger</text>

  <!-- Consumed -> Cleanly Finished : long up-right diagonal, label sits on the line -->
  <path class="edge" d="M 800,532 L 893,478" marker-end="url(#arrow)"/>
  <text class="elabel" x="848" y="498">hibernate</text>

  <!-- Consumed -> Retried Later : long down-right diagonal -->
  <path class="edge-red" d="M 800,588 L 888,642" marker-end="url(#arrow-red)"/>
  <text class="elabel-red" x="846" y="623">crashed</text>

  <!-- Early exits: Waiting -> Removed (straight up) -->
  <path class="edge" d="M 290,525 L 290,468" marker-end="url(#arrow)"/>
  <text class="elabel" x="263" y="500">removed</text>

  <!-- Early exits: Waiting -> Marked Done (up-right diagonal) -->
  <path class="edge" d="M 350,530 L 488,468" marker-end="url(#arrow)"/>
  <text class="elabel" x="430" y="490">done early</text>

  <!-- Retried Later -> Waiting : long sweep below the row, enters Waiting from the left -->
  <path class="edge-red" d="M 890,650 C 800,840 80,840 240,560" marker-end="url(#arrow-red)"/>
  <text class="elabel-red" x="490" y="815">new reminder, delay = 2ᵏ min</text>

  <!-- Legend -->
  <g transform="translate(40,880)">
    <rect x="0"   y="-10" width="14" height="14" rx="3" fill="#f3f3f3" stroke="#a0a0a0"/>
    <text class="legend" x="20"  y="1">entry / exit</text>
    <rect x="110" y="-10" width="14" height="14" rx="3" fill="#eef5ff" stroke="#6b9bd8"/>
    <text class="legend" x="130" y="1">waiting</text>
    <rect x="200" y="-10" width="14" height="14" rx="3" fill="#fff5e6" stroke="#d8a15b"/>
    <text class="legend" x="220" y="1">in-flight</text>
    <rect x="290" y="-10" width="14" height="14" rx="3" fill="#eaf7ea" stroke="#6bb06b"/>
    <text class="legend" x="310" y="1">finished</text>
    <rect x="380" y="-10" width="14" height="14" rx="3" fill="#fde8e8" stroke="#aa3333"/>
    <text class="legend" x="400" y="1">crash branch</text>
  </g>
</svg>
