name: Android

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    name: Android change scope
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: scope
        # PR checkout is the test merge: its first parent is the base branch.
        # Keep the workflow unconditional so the required APK check also
        # reports a successful skip when Android is unaffected.
        run: |
          if git diff --quiet HEAD^ HEAD -- app console .github/workflows/android.yml .github/workflows/release.yml; then
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

  apk:
    name: Build signed arm64 APK
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
          cache-bin: false

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.13846066'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Install tauri-cli
        run: cargo install tauri-cli --version 2.11.4 --locked

      # A throwaway key exercises release signing without exposing repository secrets.
      - name: Configure test signing
        run: |
          keytool -genkeypair -noprompt -storetype JKS \
            -keystore "$RUNNER_TEMP/test.jks" -storepass android-ci -keypass android-ci \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname 'CN=CI'
          printf 'keyAlias=ci\npassword=android-ci\nstoreFile=%s\n' \
            "$RUNNER_TEMP/test.jks" > app/src-tauri/gen/android/keystore.properties

      - name: Build release APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/29.0.13846066"
          cd app/src-tauri
          cargo tauri android build --apk --target aarch64

      - name: Verify APK signature
        run: |
          apk="$(find app/src-tauri/gen/android/app/build/outputs/apk \
            -path '*/release/*' -name '*.apk' ! -name '*unsigned*' | head -1)"
          test -n "$apk" || { echo "::error::no signed release APK found"; exit 1; }
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk"
          cp "$apk" cryochamber-android-arm64.apk

      - uses: actions/upload-artifact@v4
        with:
          name: cryochamber-android-arm64-test
          path: cryochamber-android-arm64.apk
