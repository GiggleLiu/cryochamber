name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Gate the release: tag/version consistency + format + lint + tests.
  # Both create-release and publish-crate depend on this passing.
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Build the Agent Console
        run: cd console && npm ci && npm run build

      - name: Console build present
        run: test -f console/dist/index.html

      # `console/dist/` is gitignored but `include`d in Cargo.toml, so the
      # publish must pass `--allow-dirty`. Guard the pairing here: if the
      # include ever stops carrying the built console, the crate would ship
      # without a page surface and only a user's `cryohub` would notice.
      - name: Packaged crate carries the console
        run: cargo package --allow-dirty --list | grep -qx 'console/dist/index.html'

      - name: Check tag matches Cargo.toml version
        run: |
          crate_version="$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)"
          echo "Cargo.toml version: ${crate_version}"
          echo "Pushed tag:         ${GITHUB_REF_NAME}"
          if [ "v${crate_version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version v${crate_version}"
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # Create GitHub release
  create-release:
    name: Create Release
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: false
          prerelease: false
          generate_release_notes: true

  # Publish to crates.io
  publish-crate:
    name: Publish to crates.io
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/package-lock.json

      - name: Build the Agent Console
        run: cd console && npm ci && npm run build

      - name: Console build present
        run: test -f console/dist/index.html

      # `--allow-dirty`: the crate `include`s `console/dist/**`, which is
      # gitignored on purpose (build output, never committed). Without the
      # flag cargo's dirty check aborts the publish on those very files.
      - name: Publish crate
        run: cargo publish --allow-dirty --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
