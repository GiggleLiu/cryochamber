[package]
name = "cryochamber"
version = "0.2.8"
edition = "2021"
description = "A hibernation chamber for AI agents — schedule, wake, and manage long-running agent tasks"
license = "MIT"
readme = "README.md"
repository = "https://github.com/GiggleLiu/cryochamber"
keywords = ["ai-agent", "automation", "scheduler", "daemon", "hibernation"]
categories = ["command-line-utilities"]

[[bin]]
name = "cryo"
path = "src/bin/cryo.rs"

[[bin]]
name = "cryo-agent"
path = "src/bin/cryo_agent.rs"

[[bin]]
name = "cryo-zulip"
path = "src/bin/cryo_zulip.rs"

[[bin]]
name = "cryohub"
path = "src/bin/cryohub.rs"

[[bin]]
name = "cryo-mock"
path = "src/bin/cryo_mock.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
libc = "0.2"
shell-words = "1.1.1"
notify = "8"
signal-hook = "0.4"
dirs = "6.0.0"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
ureq = "3"
urlencoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"
proptest = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
