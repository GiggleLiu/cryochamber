[package]
name = "cryochamber"
version = "0.1.2"
edition = "2021"
description = "A hibernation chamber for AI agents — schedule, wake, and manage long-running agent tasks"
license = "MIT"
repository = "https://github.com/GiggleLiu/cryochamber"
keywords = ["ai-agent", "automation", "scheduler", "daemon", "hibernation"]
categories = ["command-line-utilities"]

[[bin]]
name = "cryo"
path = "src/bin/cryo.rs"

[[bin]]
name = "cryo-agent"
path = "src/bin/cryo_agent.rs"

[[bin]]
name = "cryo-gh"
path = "src/bin/cryo_gh.rs"

[[bin]]
name = "cryo-zulip"
path = "src/bin/cryo_zulip.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
lettre = "0.11"
shell-words = "1.1.1"
notify = "8"
dirs = "6.0.0"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
notify-rust = "4"
ureq = "3"
which = "7"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_System_IO",
] }
windows-service = "0.7"

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"
tempfile = "3"
