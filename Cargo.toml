[package]
name = "cryochamber"
version = "0.2.8"
edition = "2021"
description = "A hibernation chamber for AI agents — schedule, wake, and manage long-running agent tasks"
license = "MIT"
readme = "README.md"
repository = "https://github.com/GiggleLiu/cryochamber"
keywords = ["ai-agent", "automation", "scheduler", "daemon", "hibernation"]
categories = ["command-line-utilities"]
build = "build.rs"
# Ship exactly what the binaries need. `include` (not `exclude`) because
# `console/dist/` is gitignored and only an explicit include overrides that:
# the built Agent Console must travel inside the crate so `cargo install`
# users get it out of the binary (an operator-set `console_dir` is the one
# override that reads a build from disk instead). Console *sources* stay out.
include = [
    "src/**",
    "tests/**",
    "templates/**",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE",
    "console/dist/**",
]

[[bin]]
name = "cryo"
path = "src/bin/cryo.rs"

[[bin]]
name = "cryo-agent"
path = "src/bin/cryo_agent.rs"

[[bin]]
name = "cryo-zulip"
path = "src/bin/cryo_zulip.rs"

[[bin]]
name = "cryohub"
path = "src/bin/cryohub.rs"

[[bin]]
name = "cryo-mock"
path = "src/bin/cryo_mock.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
anyhow = "1"
libc = "0.2"
shell-words = "1.1.1"
notify = "8"
signal-hook = "0.4"
dirs = "6.0.0"
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync", "time"] }
ureq = "3"
urlencoding = "2"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
rust-embed = "8"

[dev-dependencies]
assert_cmd = "2.1.2"
predicates = "3.1.4"
proptest = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
